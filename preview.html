<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>연연 | 5장 디자인 미리보기</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f4f5;color:#3c2f39;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}header{max-width:680px;margin:auto;padding:20px 22px;display:flex;justify-content:space-between;align-items:center}.brand{font:800 25px Georgia,serif;letter-spacing:.1em}.tag{font-size:12px;color:#a47c93}main{max-width:620px;margin:0 auto 60px;padding:22px;background:#fff;border-radius:25px;box-shadow:0 12px 50px #4022380b}.progress{display:flex;gap:7px;margin-bottom:26px}.progress span{flex:1;height:5px;border-radius:8px;background:#ede6e9}.progress span.on{background:#c97d9e}.chapter{display:none}.chapter.active{display:block}.kicker{font-size:12px;color:#b37b98;letter-spacing:.13em;font-weight:800}h1{font-size:clamp(24px,6vw,34px);line-height:1.3;letter-spacing:-.05em;margin:12px 0 19px}.scene{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(150deg,#fff0e7,#f4e4f2 55%,#d9ecf7);height:330px;display:grid;place-items:center}.scene.night{background:linear-gradient(150deg,#24365f,#7a78aa 60%,#f2b4ad)}.scene.garden{background:linear-gradient(155deg,#e4f5e4,#ffe9c9 65%,#d6e7e5)}.scene.storm{background:linear-gradient(150deg,#394965,#7786a8 65%,#b2b7d1)}.scene.sunset{background:linear-gradient(160deg,#ffdfc6,#f6b6ba 55%,#aaa5d6)}.scene svg{width:min(96%,490px);height:100%}.headline{font-size:22px;line-height:1.5;font-weight:800;letter-spacing:-.04em;margin:25px 0 9px}.summary{font-size:16px;line-height:1.9;color:#705e6b}.detail{font-size:15px;line-height:2;color:#514551;white-space:pre-line;margin-top:20px;padding:20px;border-radius:16px;background:#faf7f7}.detail[hidden]{display:none}.expand{background:transparent;border:0;color:#a15c81;font-weight:750;padding:12px 0;font-size:15px;cursor:pointer}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:25px}.nav button{padding:14px 18px;border-radius:14px;border:1px solid #e5d6de;background:white;color:#77536a;font-weight:750;cursor:pointer}.nav button.next{background:#4b3546;color:#fff;border-color:#4b3546}.nav button:disabled{opacity:.35;cursor:default}.foot{text-align:center;font-size:12px;color:#998895;margin:23px 0}svg .eye{fill:#43384b}svg .smile{stroke:#43384b;stroke-width:2.5;fill:none;stroke-linecap:round}@media(max-width:650px){main{margin:0 10px 35px;padding:18px 16px;border-radius:19px}.scene{height:290px}header{padding:16px 22px}}
body.embedded{background:transparent}body.embedded header,body.embedded .progress,body.embedded .kicker,body.embedded h1,body.embedded .headline,body.embedded .summary,body.embedded .expand,body.embedded .detail,body.embedded .nav,body.embedded .foot{display:none!important}body.embedded main{padding:0;margin:0;max-width:none;box-shadow:none;background:transparent;border-radius:0}body.embedded .scene{height:100vh;border-radius:14px}body.embedded .chapter{margin:0}</style></head><body><header><span class="brand">緣硏 · 연연</span><span class="tag">디자인 미리보기</span></header><main><div class="progress" id="progress"></div><div id="content"></div><nav class="nav"><button id="prev" onclick="go(-1)">← 이전 장</button><button class="next" id="next" onclick="go(1)">다음 장 →</button></nav><p class="foot">병화 × 계수 · 백소정 × 허선 · 화면 디자인 검토용</p></main><script>
const chapters=[
{title:"우리는 왜 백소정과 허선일까?",short:"사랑을 움직이는 사람, 사랑을 머물게 하는 사람",desc:"불은 먼저 다가가고, 물은 그 마음을 조용히 받아 줘요. 서로 다른 사랑의 언어가 만나는 첫 장면이에요.",detail:"사주팔자 분석에 따르면, 당신은 허선을, 상대방은 백소정을 닮았어요.\n\n백소정을 닮은 병화(丙火)는 태양처럼 빛을 바깥으로 드러내는 기운이에요. 허선을 닮은 계수(癸水)는 비와 이슬처럼 조용히 스며드는 기운이죠.\n\n한 사람은 사랑을 움직이게 하고, 다른 사람은 그 사랑이 오래 머물 자리를 만들어 줘요.",mode:"intro",cls:""},
{title:"백소정과 허선은 어떤 사랑을 했을까?",short:"서로 다른 두 마음이 가까워졌어요",desc:"작은 친절로 시작된 인연. 불은 꽃을 건네고, 물은 용기를 내어 한 걸음 다가와요.",detail:"비 오는 날, 허선은 곤란해진 백소정에게 먼저 우산을 건넸어요. 백소정은 그 다정함을 놓치지 않고 사랑으로 키워 나갔죠.\n\n두 사람은 함께 약방을 꾸렸지만, 백소정의 정체가 밝혀지면서 커다란 시련을 맞아요.\n\n백소정은 사랑을 지키기 위해 행동했고, 허선은 두려움을 넘어 다시 사랑을 선택했어요.",mode:"flower",cls:"night"},
{title:"우리는 왜 서로에게 끌렸을까?",short:"다르기에 새로운 풍경이 피어나요",desc:"병화의 따뜻함과 계수의 세심함이 만나면, 혼자서는 만들지 못했던 새싹이 자랄 수도 있어요.",detail:"상대방은 태양처럼 밝게 빛나는 병화(丙火), 당신은 비와 이슬처럼 스며드는 계수(癸水)의 기운을 지녔어요.\n\n전통 사주에서 물과 불은 서로 제어하는 수극화(水剋火) 관계예요. 하지만 상극이 곧 불행을 의미하지는 않아요.\n\n상대방의 적극성은 당신의 세계를 넓히고, 당신의 세심함은 상대방의 세계를 깊게 만들어 줄 수 있어요.",mode:"sprout",cls:"garden"},
{title:"그런데 왜 사랑하면서도 어긋날까?",short:"같은 마음도 다른 속도로 전해져요",desc:"불은 서둘러 다가가고 물은 잠시 물러나요. 사랑이 부족해서가 아니라 서로의 속도가 달라서일 수 있어요.",detail:"두 사람을 끌리게 했던 차이가 때로는 가장 이해하기 어려운 모습이 될 수 있어요.\n\n상대방의 적극성은 조급함으로, 당신의 신중함은 무관심으로 오해받을 수 있죠.\n\n한 사람은 도와주고 있다고 생각하는데 다른 사람은 자신의 마음을 알아주지 않는다고 느낄 수도 있어요. 행동 뒤의 마음을 알아갈 때 차이는 이해의 시작이 돼요.",mode:"apart",cls:"storm"},
{title:"우리는 다른 결말을 만들 수 있을까?",short:"우리의 다음 장면은 우리가 만들어요",desc:"불은 조금 천천히, 물은 한 걸음 먼저. 서로의 본질을 바꾸지 않고도 같은 방향을 바라볼 수 있어요.",detail:"백소정과 허선의 사랑은 세상의 벽 앞에서 멈췄지만, 당신과 상대방의 이야기는 아직 쓰이고 있어요.\n\n상대방에게는 먼저 손 내미는 다정함에 기다리는 여유를, 당신에게는 조용히 지키는 마음에 표현하는 용기를 더하는 선택이 있을 수 있어요.\n\n백소정과 허선의 이야기는 오래전에 끝났지만, 두 사람의 이야기는 아직 끝나지 않았어요.",mode:"together",cls:"sunset"}];
function scene(mode){let fireX=mode==="apart"?105:mode==="together"?175:125,waterX=mode==="apart"?360:mode==="together"?295:330;let fireFace=mode==="apart"?"sad":"happy",waterFace=mode==="apart"?"sad":"happy";let extras=mode==="flower"?'<path d="M244 208 Q253 160 266 130" stroke="#568a60" stroke-width="6" fill="none"/><path d="M266 135 C238 120 243 105 264 112 C274 93 291 111 272 133Z" fill="#f7a6c0"/><circle cx="264" cy="120" r="7" fill="#ffe6a1"/>':mode==="sprout"?'<path d="M248 266 L248 207" stroke="#538d65" stroke-width="8"/><path d="M248 233 Q205 228 212 202 Q241 199 248 233 M248 224 Q291 222 284 192 Q258 193 248 224" fill="#8acb90"/>':mode==="apart"?'<path d="M242 70 L224 130 L248 159 L229 210" stroke="#e1d6ef" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M0 255 Q250 220 500 260" stroke="#c5d2e9" stroke-width="2" fill="none" stroke-dasharray="6 11"/>':mode==="together"?'<path d="M227 145 C210 123 185 147 227 179 C269 147 244 123 227 145" fill="#ef8fa9"/><path d="M210 255 Q250 245 285 255" stroke="#f7e4c7" stroke-width="13" fill="none" stroke-linecap="round"/>':'<path d="M233 125 C219 107 202 130 233 153 C264 130 247 107 233 125" fill="#ef9ab3"/>';let eyeFire=fireFace==="sad"?'<circle cx="107" cy="204" r="4"/><circle cx="139" cy="204" r="4"/><path d="M111 225 Q123 213 136 225" class="smile"/>':'<ellipse cx="109" cy="204" rx="7" ry="9" fill="#46333c"/><ellipse cx="140" cy="204" rx="7" ry="9" fill="#46333c"/><circle cx="111" cy="200" r="3" fill="white"/><circle cx="142" cy="200" r="3" fill="white"/><path d="M116 223 Q125 237 135 223Z" fill="#b95564" stroke="#784653" stroke-width="1.4"/>';let eyeWater=waterFace==="sad"?'<circle cx="316" cy="206" r="4"/><circle cx="344" cy="206" r="4"/><path d="M317 227 Q331 216 344 227" class="smile"/>':'<ellipse cx="316" cy="205" rx="7" ry="9" fill="#354c6b"/><ellipse cx="345" cy="205" rx="7" ry="9" fill="#354c6b"/><circle cx="318" cy="201" r="3" fill="white"/><circle cx="347" cy="201" r="3" fill="white"/><path d="M320 224 Q330 239 341 224Z" fill="#a65b83" stroke="#607395" stroke-width="1.4"/>';let action=mode==="flower"?'<path d="M190 228 Q218 194 244 208" stroke="#f8a16d" stroke-width="13" fill="none" stroke-linecap="round"/>':mode==="sprout"?'<path d="M188 239 Q212 250 233 239" stroke="#f8a16d" stroke-width="12" fill="none" stroke-linecap="round"/>':mode==="apart"?'<path d="M177 238 Q194 229 207 240" stroke="#f8a16d" stroke-width="12" fill="none" stroke-linecap="round"/>':mode==="together"?'<path d="M216 232 Q237 210 250 233" stroke="#f8a16d" stroke-width="15" fill="none" stroke-linecap="round"/>':'<path d="M190 232 Q220 211 234 228" stroke="#f8a16d" stroke-width="12" fill="none" stroke-linecap="round"/>';return '<svg viewBox="0 0 500 330" role="img" aria-label="불과 물 캐릭터가 관계의 변화를 보여 주는 그림"><defs><linearGradient id="f" x2=".6" y2="1"><stop stop-color="#ffe4a1"/><stop offset=".5" stop-color="#ffb65f"/><stop offset="1" stop-color="#f47e63"/></linearGradient><linearGradient id="w" x2=".8" y2="1"><stop stop-color="#d5f5ff"/><stop offset=".55" stop-color="#9bd8f5"/><stop offset="1" stop-color="#7aa6ed"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="15"/></filter></defs><circle cx="110" cy="160" r="85" fill="#ffdc9c" opacity=".24" filter="url(#glow)"/><circle cx="355" cy="160" r="90" fill="#bbdff8" opacity=".26" filter="url(#glow)"/><g fill="#fff" opacity=".85"><path d="M55 95 l5 -12 5 12 12 5 -12 5 -5 12 -5 -12 -12 -5Z"/><path d="M419 92 l4 -10 4 10 10 4 -10 4 -4 10 -4 -10 -10 -4Z"/><circle cx="238" cy="74" r="4"/><circle cx="403" cy="165" r="3"/></g><ellipse cx="245" cy="285" rx="205" ry="19" fill="#ffffff" opacity=".35"/>'+extras+'<g transform="translate('+(fireX-125)+' 0)"><path d="M90 260 C45 220 65 165 88 130 C95 163 115 146 120 63 C180 127 203 188 163 249 Q129 281 90 260Z" fill="url(#f)" stroke="#fff4df" stroke-width="3"/><path d="M108 260 C92 237 115 215 122 185 C150 215 161 244 145 260Z" fill="#ffe6a4" opacity=".9"/><g class="eye">'+eyeFire+'</g><ellipse cx="99" cy="219" rx="12" ry="7" fill="#ef7f82" opacity=".5"/><ellipse cx="153" cy="219" rx="12" ry="7" fill="#ef7f82" opacity=".5"/><ellipse cx="104" cy="267" rx="15" ry="7" fill="#f99c76"/><ellipse cx="151" cy="267" rx="15" ry="7" fill="#f99c76"/><path d="M92 246 Q66 238 65 217 M160 246 Q183 234 182 217" stroke="#f69d66" stroke-width="12" stroke-linecap="round" fill="none"/></g><g transform="translate('+(waterX-330)+' 0)"><path d="M330 71 C302 113 273 160 273 202 A57 57 0 0 0 387 202 C387 160 355 112 330 71Z" fill="url(#w)" stroke="#e9faff" stroke-width="4"/><ellipse cx="310" cy="153" rx="13" ry="28" fill="#fff" opacity=".38" transform="rotate(22 310 153)"/><g class="eye">'+eyeWater+'</g><ellipse cx="300" cy="220" rx="12" ry="7" fill="#f8a5b5" opacity=".5"/><ellipse cx="357" cy="220" rx="12" ry="7" fill="#f8a5b5" opacity=".5"/><ellipse cx="307" cy="258" rx="15" ry="7" fill="#87b9ec"/><ellipse cx="352" cy="258" rx="15" ry="7" fill="#87b9ec"/><path d="M290 245 Q271 241 270 225 M370 245 Q390 236 389 225" stroke="#8bbbe8" stroke-width="12" stroke-linecap="round" fill="none"/></g>'+action+'</svg>'}
let current=0;function render(){const c=chapters[current];document.getElementById("progress").innerHTML=chapters.map((_,i)=>'<span class="'+(i<=current?'on':'')+'"></span>').join("");document.getElementById("content").innerHTML='<section class="chapter active"><div class="kicker">CHAPTER '+String(current+1).padStart(2,"0")+' / 05</div><h1>'+c.title+'</h1><div class="scene '+c.cls+'">'+scene(c.mode)+'</div><div class="headline">'+c.short+'</div><div class="summary">'+c.desc+'</div><button class="expand" onclick="toggle()">이야기 자세히 읽기 ＋</button><div class="detail" id="detail" hidden>'+c.detail+'</div></section>';document.getElementById("prev").disabled=current===0;document.getElementById("next").disabled=current===4;window.scrollTo({top:0,behavior:"smooth"})}function toggle(){const d=document.getElementById("detail");d.hidden=!d.hidden;document.querySelector(".expand").textContent=d.hidden?"이야기 자세히 읽기 ＋":"이야기 접기 −"}function go(n){current=Math.max(0,Math.min(4,current+n));render()}if(new URLSearchParams(location.search).has('embed')){document.body.classList.add('embedded');current=Math.max(0,Math.min(4,Number(new URLSearchParams(location.search).get('chapter'))||0));}render();
</script></body></html>
