name: Report quality and distribution audit
on:
  pull_request:
    paths:
      - 'audit_quality.py'
      - 'test_audit_quality.py'
      - '.github/workflows/audit-quality.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest test_audit_quality.py -v
      - name: Generate audit result (do not discard output on diagnostic failure)
        run: python audit_quality.py --samples 2400 --repeat 30 > audit-results.json || echo 'Audit gate failed; results retained for inspection'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-results
          path: audit-results.json
      - name: Enforce distribution and determinism gates
        run: python -c "import json; r=json.load(open('audit-results.json')); print('counts:', r['counts']); print('flags:', r['distribution_flags']); print('max_share:', r['max_share']); assert r['distribution_ok'] and r['deterministic']"
