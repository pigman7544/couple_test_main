name: 2400-pair audit
on:
  pull_request:
    paths:
      - 'audits/**'
      - '.github/workflows/audit-2400.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m audits.audit_2400 | tee audit-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-2400-result
          path: audit-result.json
