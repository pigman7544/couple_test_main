<script>"use strict";

const series = JSON.parse(document.querySelector("#series-data").textContent);
const months = JSON.parse(document.querySelector("#calendar-data").textContent);
const app = document.querySelector("#app");
const stems = "갑을병정무기경신임계";
const stemNames = ["갑목", "을목", "병화", "정화", "무토", "기토", "경금", "신금", "임수", "계수"];
const defaults = () => ({date: "", calendar: "solar", gender: "", time: "", leap: false});
const state = {people: [defaults(), defaults()], stems: [], book: null, chapter: 0, archive: false, unlocked: false};
const books = new Map(series.manuscripts.map(book => [[...book.key].sort().join(""), book]));
const escape = value => String(value).replace(/[&<>"']/g, ch => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"}[ch]));
const inline = value => escape(value).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
const button = (label, action, type = "primary") =>
  `<button type="button" class="btn ${type}" data-action="${action}">${label}</button>`;
const back = (label, action) => `<button type="button" class="back" data-action="${action}">← ${label}</button>`;
const actions = (...buttons) => `<div class="actions">${buttons.join("")}</div>`;
const toc = () => `<ol class="toc">${series.chapters.map((ch, i) => `<li><span>0${i + 1}</span> ${escape(ch.label)}</li>`).join("")}</ol>`;

function show(html, title = series.name) {
  app.innerHTML = html;
  if (app.querySelector(".article")) window.annotateSaju(app.querySelectorAll(".article"));
  document.title = title === series.name ? `${title} · 연연` : `${title} · ${series.name}`;
  const heading = app.querySelector("h1");
  heading.tabIndex = -1;
  heading.focus({preventScroll: true});
  window.scrollTo(0, 0);
}

function home() {
  show(`<section class="hero">
    <div class="cover" aria-hidden="true">
      <span class="star star-one">✧</span><span class="star star-two">·</span><span class="star star-three">✦</span>
      <div class="book"><div class="leaf"><i></i><i></i><i></i></div><div class="leaf"><i></i><i></i><i></i></div><div class="ribbon"></div></div>
    </div>
    <div class="hero-copy"><span class="eyebrow">${escape(series.edition)}</span>
      <h1>우리 둘은<br>어떤 이야기일까?</h1>
      <p>두 사람의 생일을 바탕으로, 문학 속 인물의 마음과 우리 사이에 생길 법한 장면을 읽어 보세요.</p>
    </div></section>
    ${actions(button("우리 이야기 찾기 <span aria-hidden='true'>→</span>", "form"))}
    <section class="home-details">${toc()}<p class="caption">전통 사주의 상징을 바탕으로 한 문학적 관계 해석이에요. 성격이나 미래를 확정하는 검사는 아니에요.</p></section>`);
}

function fieldset(person, i) {
  const prefix = `person-${i}`;
  const field = (name, label, control) => `<div><label class="label" for="${prefix}-${name}">${label}</label>${control}</div>`;
  const select = (name, options) => `<select id="${prefix}-${name}" name="${name}${i}" required>
    ${options.map(([value, label]) => `<option value="${value}"${person[name] === value ? " selected" : ""}>${label}</option>`).join("")}
    </select>`;
  return `<fieldset class="panel"><legend>${i === 0 ? "나" : "상대방"}</legend>
    <div class="fields">
    ${field("date", "생년월일", `<input id="${prefix}-date" name="date${i}" type="text" data-date
        inputmode="numeric" autocomplete="off" maxlength="10" placeholder="1995-03-21" value="${escape(person.date)}" required>`)}
    ${field("calendar", "달력", select("calendar", [["solar", "양력"], ["lunar", "음력"]]))}
    <label class="check" id="${prefix}-leap-wrap"${person.calendar === "lunar" ? "" : " hidden"}><input type="checkbox" name="leap${i}"${person.leap ? " checked" : ""}> 음력 윤달이에요</label>
    ${field("gender", "성별", select("gender", [["", "선택해 주세요"], ["female", "여성"], ["male", "남성"], ["other", "기타 / 응답하지 않음"]]))}
    ${field("time", "태어난 시간 <em>선택</em>", `<input type="time" id="${prefix}-time" name="time${i}" value="${escape(person.time)}">`)}
    </div></fieldset>`;
}

function input() {
  show(`<section class="page"><a class="back" href="/">← 생년월일로 관계 분석</a>
    <div class="heading"><span class="eyebrow">두 사람의 정보</span><h1>생일을 알려 주세요</h1>
    <p class="caption">연·월·일 순서로 입력해 주세요. 입력한 정보는 이 화면에서만 사용해요. 시제품의 원고 선택에는 생년월일과 달력 구분을 사용해요.</p></div>
    <form id="birth-form" autocomplete="off" novalidate>${state.people.map(fieldset).join("")}
      <p class="error" id="form-error" role="alert" hidden></p>
      <button class="btn primary" type="submit">우리 이야기 찾기 <span aria-hidden="true">→</span></button>
    </form></section>`, "두 사람의 정보");
  const form = document.querySelector("#birth-form");
  form.addEventListener("input", event => {
    if (event.target.matches("[data-date]")) {
      const digits = event.target.value.replace(/\D/g, "").slice(0, 8);
      event.target.value = [digits.slice(0, 4), digits.slice(4, 6), digits.slice(6)].filter(Boolean).join("-");
    }
    for (let i = 0; i < 2; i++) {
      document.querySelector(`#person-${i}-leap-wrap`).hidden = form.elements[`calendar${i}`].value !== "lunar";
    }
    saveDraft(form);
    document.querySelector("#form-error").hidden = true;
    form.querySelectorAll("[aria-invalid]").forEach(el => el.removeAttribute("aria-invalid"));
  });
  form.addEventListener("submit", submit);
}

function saveDraft(form) {
  const values = new FormData(form);
  state.people = [0, 1].map(i => ({
    date: values.get(`date${i}`), gender: values.get(`gender${i}`),
    time: values.get(`time${i}`), calendar: values.get(`calendar${i}`),
    leap: values.get(`leap${i}`) === "on"
  }));
}

function dayStem(person) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(person.date)) return null;
  const [year, month, day] = person.date.split("-").map(Number);
  if (year < 1000 || year > 2050 || month < 1 || month > 12) return null;
  const solar = person.calendar === "solar";
  const mode = solar ? 0 : person.leap ? 2 : 1;
  const monthData = months[(year - 1000) * 12 + month - 1][mode];
  const first = solar && year === 1000 && month === 2 ? 13 : 1;
  const reform = solar && year === 1582 && month === 10;
  if (!monthData || day < first || day > Math.floor(monthData / 10) || (reform && day >= 5 && day <= 14)) return null;
  return stems[(monthData % 10 + day - first - (reform && day >= 15 ? 10 : 0)) % 10];
}

function submit(event) {
  event.preventDefault();
  saveDraft(event.currentTarget);
  const results = state.people.map(dayStem);
  const invalid = state.people.findIndex((person, i) => !results[i] || !person.gender);
  if (invalid >= 0) {
    const error = document.querySelector("#form-error");
    const who = invalid ? "상대방" : "나";
    const dateInvalid = !results[invalid];
    error.textContent = dateInvalid
      ? `${who}의 생년월일을 확인해 주세요. 달력 종류와 윤달 여부까지 확인해 주세요. 지원 연도는 1000~2050년이에요.`
      : `${who}의 성별을 선택해 주세요. 답하고 싶지 않다면 ‘기타 / 응답하지 않음’을 선택할 수 있어요.`;
    error.hidden = false;
    const field = document.querySelector(`#person-${invalid}-${dateInvalid ? "date" : "gender"}`);
    field.setAttribute("aria-invalid", "true");
    field.focus();
    return;
  }
  state.stems = results;
  state.archive = false;
  state.unlocked = false;
  state.book = books.get([...results].sort().join(""));
  state.chapter = 0;
  preview();
}

function stemName(stem) { return stemNames[stems.indexOf(stem)]; }
function overview() {
  const pair = state.archive
    ? [...state.book.key].map(stemName)
    : state.stems.map((stem, i) => `${i ? "상대방" : "나"} · ${stemName(stem)}`);
  return `<div class="pair">${pair.map(label => `<span>${label}</span>`).join("")}</div>`;
}

function preview() {
  const previous = state.archive ? back("원고 서가", "library") : back("입력 수정", "form");
  if (!state.book) {
    show(`<section class="page">${previous}<div class="result-top"><span class="eyebrow">일간 결과</span>
      <h1>아직 준비 중인<br>이야기예요</h1>${overview()}</div>
      <p>이 조합의 결과지는 지금 검토할 수 없어요. 서가에서 다른 조합의 원고를 읽어 보세요.</p>
      ${actions(button("원고 서가 열기", "library"), button("입력 다시 확인", "form", "secondary"))}</section>`, "원고 준비 중");
    return;
  }
  const book = state.book;
  const sample = book.chapters[0].body.split(/\n\n/).find(block => !block.startsWith("#") && !block.startsWith("**"));
  show(`<section class="page">${previous}<div class="result-top"><span class="eyebrow">${state.archive ? "서가 · 무료 미리보기" : "일간 결과 · 무료 미리보기"}</span>
    <h1>${escape(book.title)}</h1><p>《${escape(book.work)}》 속 인물에서 가져온 이야기</p>${overview()}</div>
    <div class="excerpt"><span class="stamp">1장 · ${escape(series.chapters[0].label)}</span>
      <h2>${escape(book.chapters[0].title)}</h2><p>${inline(sample)}</p></div>
    ${roleNote()}<h2>전체 결과지</h2>${toc()}
    ${actions(button("전체 결과지 열기 <span aria-hidden='true'>→</span>", state.unlocked ? "resume" : "checkout"))}
    <p class="caption">${state.unlocked ? "모의 결제를 마친 결과지예요." : "5,000원 테스트 · 실제 청구 없이 열 수 있어요."}</p></section>`, "결과지 미리보기");
}

function checkout() {
  show(`<section class="page">${back("미리보기", "preview")}
    <div class="heading"><span class="stamp">모의 결제</span><h1>전체 결과지를 열어요</h1><p>원작 속 인물 읽기부터 가상의 일상 장면과 대화 제안까지, 세 장을 모두 읽을 수 있어요.</p></div>
    <div class="panel"><span class="eyebrow">${escape(series.edition)}</span><h2>${escape(state.book.title)}</h2>
      <div class="bill"><span>상품</span><strong>관계 결과지 1편</strong></div>
      <div class="bill"><span>테스트 가격</span><strong>5,000원</strong></div>
      <div class="bill"><span>실제 청구</span><strong>없음</strong></div></div>
    ${actions(button("모의 결제하고 읽기", "unlock"), button("미리보기로 돌아가기", "preview", "secondary"))}
    <p class="caption">카드나 계좌 정보를 입력할 필요 없이 전체 결과지가 열려요.</p></section>`, "모의 결제");
}

function roleNote() {
  const book = state.book;
  const roles = book.key[0] !== book.key[1] && book.note.includes("‘당신’");
  if (!roles) return "";
  const reader = state.archive
    ? `${stemName(book.key[0])} 쪽은 ‘당신’, ${stemName(book.key[1])} 쪽은 ‘상대방’으로 불러요.`
    : `이 글에서 ‘당신’은 ${stemName(book.key[0])}인 ${state.stems[0] === book.key[0] ? "나" : "상대방"}을 가리켜요.`;
  return `<div class="reading-note"><p class="caption">${escape(reader)}</p></div>`;
}

function prose(body) {
  return body.split(/\n\n+/).map(block => block.startsWith("### ")
    ? `<h3>${inline(block.slice(4))}</h3>`
    : `<p>${inline(block).replace(/\n/g, "<br>")}</p>`).join("");
}

function read(unlocked = false) {
  const i = state.chapter;
  const chapter = state.book.chapters[i];
  const metadata = series.chapters[i];
  show(`<section class="page">${back(state.archive ? "원고 서가" : "미리보기", state.archive ? "library" : "preview")}
    <div class="heading"><span class="eyebrow">전체 결과지 · 《${escape(state.book.work)}》</span><h1>${escape(state.book.title)}</h1>
      ${unlocked ? '<p class="caption" role="status">모의 결제를 마쳤어요. 세 장을 모두 읽을 수 있어요.</p>' : ""}</div>
    <nav class="reader-nav" aria-label="결과지 목차">${series.chapters.map((ch, n) =>
      `<button type="button" class="btn secondary" data-action="chapter-${n}"${n === i ? ' aria-current="step"' : ""}>${n + 1}장 · ${escape(ch.short)}</button>`).join("")}</nav>
    <article class="article"><span class="stamp">${i + 1}장 · ${escape(metadata.label)}</span><h2>${escape(chapter.title)}</h2>
      ${i === 0 ? roleNote() : ""}${prose(chapter.body)}</article>
    ${i === 2 ? '<p class="finish">결과지의 마지막 장이에요.</p>' : ""}
    <div class="spread">${i > 0 ? button("← 이전 장", `chapter-${i - 1}`, "secondary") : button("목차 처음으로 ↑", "top", "secondary")}
      ${i < 2 ? button("다음 장 →", `chapter-${i + 1}`) : button(state.archive ? "서가로 돌아가기" : "다른 생일로 보기", state.archive ? "library" : "restart")}</div>
    </section>`, chapter.title);
}

function library() {
  const entries = [...series.manuscripts].sort((a, b) => a.key.localeCompare(b.key, "ko"));
  show(`<section class="page"><a class="back" href="/">← 생년월일로 관계 분석</a>
    <div class="heading"><span class="eyebrow">검토용 원고 · ${entries.length}편</span><h1>원고 서가</h1>
      <p class="caption">일간 조합별 편집 초안 37편이에요. 생년월일을 입력해 받은 개인화 결과는 분석 화면에서 볼 수 있어요.</p></div>
    <label class="label" for="search">원고 검색</label><input type="search" id="search" placeholder="조합, 작품명, 제목으로 찾기">
    <p class="caption" id="count" role="status"></p><div class="catalogue" id="entries"></div></section>`, "원고 서가");
  const search = document.querySelector("#search");
  function filter() {
    const query = search.value.trim();
    const found = entries.filter(book => [book.key, book.title, book.work].some(text => text.includes(query)));
    document.querySelector("#count").textContent = found.length ? `${found.length}편` : "검색 결과가 없어요.";
    document.querySelector("#entries").innerHTML = found.map(book => `<button class="entry" data-action="book-${book.code}"><span>${book.key}</span><span><strong>${escape(book.title)}</strong><small>${escape(book.work)}</small></span><span aria-hidden="true">→</span></button>`).join("");
  }
  search.addEventListener("input", filter);
  filter();
}

const navigation = {
  home, form: input, preview, checkout, library,
  restart() {
    state.people = [defaults(), defaults()];
    input();
  },
  unlock() { state.unlocked = true; state.chapter = 0; read(true); },
  resume() { read(); },
  top() {
    app.querySelector("h1").focus({preventScroll: true});
    window.scrollTo(0, 0);
  },
};

document.addEventListener("click", event => {
  const action = event.target.closest("button[data-action]")?.dataset.action;
  if (!action) return;
  if (action.startsWith("chapter-")) {
    state.chapter = Number(action.slice(8));
    read();
  } else if (action.startsWith("book-")) {
    state.book = series.manuscripts.find(book => book.code === action.slice(5));
    state.archive = true;
    state.unlocked = false;
    preview();
  } else {
    navigation[action]();
  }
});
library();
</script>
</body>
</html>
