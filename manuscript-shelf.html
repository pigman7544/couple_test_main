<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>우리 둘의 이야기 · 연연</title>
<style>:root {
  --paper: #f8f5ec;
  --ink: #22352d;
  --muted: #535e53;
  --line: #d6d7c9;
  --red: #913e32;
  --green: #243f34;
  --serif: "Noto Serif KR", "Batang", "AppleMyungjo", Georgia, serif;
  font-family: system-ui, "Malgun Gothic", sans-serif;
  color: var(--ink);
  background: var(--paper);
}
* { box-sizing: border-box; }
body { margin: 0; overflow-wrap: anywhere; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--red); outline-offset: 4px; }
[hidden] { display: none !important; }
.masthead {
  max-width: 1032px; margin: auto; height: 70px; padding: 0 20px; display: flex;
  justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); gap: 10px;
}
.brand, .library-link, .back { background: none; padding: 0; border: 0; min-height: 44px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 680; font-size: 15px; }
.seal { display: inline-grid; place-content: center; color: var(--red); border: 1px solid var(--red); width: 29px; height: 31px; border-radius: 3px; font: 11px/.98 var(--serif); }
.library-link { font-size: 13px; color: var(--muted); }
.library-link span { margin-left: 4px; color: var(--red); }
main { max-width: 1032px; margin: auto; padding: 22px 18px 0; min-height: 65vh; }
footer { margin: 48px auto 0; padding: 23px 20px 26px; max-width: 1032px; border-top: 1px solid var(--line); text-align: center; color: var(--muted); font-size: 12px; }
footer span { margin: 0 6px; }
h1, h2, h3, p { margin: 0; }
h1, h2 { font-family: var(--serif); word-break: keep-all; }
h1 { font-size: clamp(30px, 8vw, 52px); line-height: 1.27; letter-spacing: -.065em; font-weight: 700; }
h1[tabindex="-1"]:focus { outline: none; }
h2 { font-size: 25px; line-height: 1.42; letter-spacing: -.045em; }
p { line-height: 1.75; word-break: keep-all; }
.eyebrow { color: var(--red); font-size: 12px; font-weight: 700; letter-spacing: .11em; }
.hero { display: grid; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.hero-copy { padding: 32px 23px 27px; background: #f2eee1; }
.hero h1 { margin: 15px 0; }
.hero-copy p { font-size: 15px; color: var(--muted); max-width: 28ch; }
.cover { min-height: 228px; color: #f1dfb2; display: grid; place-items: center; position: relative; overflow: hidden;
  background: repeating-linear-gradient(110deg,#ffffff06 0 1px, transparent 1px 4px), radial-gradient(ellipse at 50% 35%, #4c6651, #20382e 77%); }
.cover::before, .cover::after { content: ""; position: absolute; border: 1px solid #e3d0a65c; inset: 11px; border-radius: 3px; }
.cover::after { inset: 17px; border-color: #e3d0a62b; }
.book { position: relative; display: flex; width: 166px; height: 101px; transform: rotate(-9deg); filter: drop-shadow(0 12px 10px #10231d99); }
.leaf { width: 50%; background: #eadeba; border: 1px solid #b1a175; box-shadow: 0 4px #b8a67a, 0 8px #716444; position: relative; padding-top: 23px; }
.leaf:first-child { transform: skewY(8deg); border-radius: 8px 2px 1px 3px; background: linear-gradient(85deg,#eee1ba,#ddcda2 85%,#b5a47a); }
.leaf:last-child { transform: skewY(-8deg); border-radius: 2px 8px 3px 1px; background: linear-gradient(90deg,#beac80,#f0e3bd 22%); }
.leaf i { display: block; width: 58%; height: 1px; margin: 9px auto; background: #7a745b71; }
.leaf i:last-child { width: 39%; }
.ribbon { position: absolute; top: 49px; left: 52%; width: 12px; height: 74px; background: #a64f3e; clip-path: polygon(0 0,100% 0,100% 100%,50% 88%,0 100%); transform: rotate(-8deg); }
.star { position: absolute; font-weight: 300; }
.star-one { top: 14%; left: 21%; font-size: 28px; }.star-two { right: 17%; top: 25%; }.star-three { right: 21%; bottom: 18%; font-size: 25px; }
.actions, .page, .home-details { max-width: 660px; margin: 0 auto; }
.actions { display: grid; gap: 8px; margin-top: 19px; }
.btn { display: inline-flex; min-height: 50px; align-items: center; justify-content: center; gap: 9px; width: 100%; border: 1px solid var(--green); border-radius: 5px; padding: 11px 16px; font-weight: 690; text-align: center; line-height: 1.4; }
.primary { color: #fffdf4; background: var(--green); }
.primary:hover { background: #315347; }
.secondary { background: transparent; border-color: var(--line); }
.secondary:hover { background: #eeeddf; }
.home-details { margin-top: 30px; border-top: 1px solid var(--line); }
.home-details .toc { margin: 12px 0; }
.caption { font-size: 13px; color: var(--muted); }
.back { margin-bottom: 13px; font-size: 14px; color: var(--muted); }
.heading { margin-bottom: 24px; }
.heading h1 { margin: 8px 0 13px; }
.panel { background: #fffdf6; border: 1px solid var(--line); border-radius: 6px; padding: 19px; margin: 15px 0; }
fieldset { min-inline-size: 0; }
legend { padding: 0 7px; color: var(--red); font-weight: 700; font-family: var(--serif); font-size: 20px; }
.label { display: block; font-size: 14px; font-weight: 650; margin: 0 0 7px; }
label em { font-size: 12px; font-style: normal; color: var(--muted); font-weight: 400; }
.fields { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 15px 11px; }
input:not([type=checkbox]),select { min-width: 0; width: 100%; min-height: 46px; padding: 8px 9px; border: 1px solid #b7bfb2; border-radius: 4px; background: #fffefa; font-size: 16px; }
.check { display: flex; align-items: center; gap: 6px; min-height: 44px; grid-column: 1/-1; font-size: 14px; }
.error { color: #8d3128; margin: 10px 0; font-size: 14px; }
.stamp { display: inline-block; padding: 5px 10px; border: 1px solid currentColor; border-radius: 20px; color: var(--red); font-size: 12px; font-weight: 650; }
.result-top { background: var(--green); color: #fff5da; border-radius: 6px; padding: 29px 22px; margin-bottom: 18px; }
.result-top h1 { margin: 11px 0 14px; }
.result-top .eyebrow { color: #ecd298; }
.pair { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 0; }
.pair span { padding: 5px 10px; border: 1px solid #ffffff60; border-radius: 30px; font-size: 13px; }
.toc { list-style: none; padding: 0; margin: 13px 0; }
.toc li { padding: 12px 0; display: flex; align-items: baseline; gap: 13px; border-bottom: 1px solid var(--line); font-size: 14px; }
.toc li span { color: var(--red); font-family: var(--serif); }
.excerpt { padding: 20px 0; }
.excerpt h2 { margin: 9px 0 14px; }
.excerpt p { font: 17px/1.95 var(--serif); }
.bill { display: flex; justify-content: space-between; gap: 14px; padding: 15px 0; border-top: 1px solid var(--line); font-size: 15px; }
.bill:first-of-type { margin-top: 14px; }
.bill:last-of-type { border-bottom: 1px solid var(--line); }
.reader-nav { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 5px; margin: 12px 0 21px; }
.reader-nav button { padding: 7px 4px; border: 1px solid var(--line); font-size: 12px; }
.reader-nav [aria-current=step] { background: var(--green); color: #fffdf4; border-color: var(--green); }
.article { border-top: 1px solid var(--line); padding: 27px 0 9px; }
.article h2 { margin: 10px 0 25px; font-size: clamp(26px, 6.7vw, 37px); }
.article h3 { margin: 27px 0 8px; font-size: 17px; }
.article p { margin-bottom: 18px; font-family: var(--serif); font-size: 18px; line-height: 1.9; }
.article strong { color: #763a31; }
.reading-note { margin: 14px 0; background: #efece0; border-left: 2px solid #b7a272; padding: 12px; }
.spread { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.catalogue { display: grid; gap: 8px; margin-top: 15px; }
.entry { display: grid; grid-template-columns: 37px minmax(0,1fr) 15px; gap: 10px; text-align: left; align-items: center; background: #fffdf6; padding: 13px; border: 1px solid var(--line); border-radius: 4px; min-height: 64px; }
.entry span:first-child { color: var(--red); font-family: var(--serif); }
.entry small { display: block; margin-top: 3px; color: var(--muted); }
.finish { margin: 20px 0 12px; padding: 15px; border: 1px solid var(--line); background: #eef0e5; }
@media (min-width: 760px) {
  main { padding: 39px 25px 0; }
  .hero { grid-template-columns: 1fr .9fr; }
  .hero-copy { padding: 55px 40px; }
  .book { scale: 1.45; }
  .actions { margin-top: 24px; }
  .result-top { padding: 35px; }
  .catalogue { grid-template-columns: 1fr 1fr; }
}
</style>

<script type="application/json" id="series-data">{"id":"literary-relationships","name":"우리 둘의 이야기","edition":"문학 관계 시리즈 · 첫 번째 이야기","chapters":[{"label":"원작 장면과 인물 해석","short":"원작"},{"label":"현대 가상 장면","short":"가상 장면"},{"label":"우리에게 건네는 제안","short":"대화 제안"}],"manuscripts":[{"code":"T18","key":"무무","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-04/무무.md","sha":"883e7f3557689149b33ebdf98b11f1d2bd1598fe","title":"늘 가던 가게 대신 가까운 곳에 갈까요?","work":"설득","note":"두 분 모두 두 인물의 관점을 함께 읽어요. 개인별 배역은 정하지 않아요. 성향은 원작 행동에 대한 해석이며 현대 장면과 대사는 가상이에요. 전체 명식 개인화는 적용하지 않았어요.","chapters":[{"title":"크로프트 부부가 함께 길을 갈 때","body":"### 소피아 크로프트의 관점\n\n**책임감** · **적극성**\n\n소피아는 결혼한 뒤 여러 차례 바다를 건넜고 남편과 배에서 지낸 때가 가장 **행복했다고 말해요**. 마차를 타고 갈 때는 기둥에 부딪힐 것 같자 남편에게 알리고 직접 **고삐를 돌려요**. 함께 탄 사람의 안전을 자기 일로 여기는 **책임감**, 위험을 알아차리자 바로 손을 보태는 **적극성**으로 해석할 수 있어요. 당장 위험을 피해야 하는 장면이라 평소 두 사람이 의견이 다를 때 어떻게 결정하는지까지는 알기 어려워요.\n\n### 크로프트 제독의 관점\n\n**다정함** · **꾸준함**\n\n제독은 아내와 함께 앤이 마차에 탈 **자리를 내 줘요**. 같이 가는 사람의 수고를 덜어 주는 **다정함**이 보여요. 제독은 웬트워스와 이야기하면서 아내와 함께 배에서 지낸 것을 두 사람이 해 온 일로 말해요. 거듭 항해를 함께하며 부부 생활을 이어 온 데서 **꾸준함**을 읽을 수 있어요. 마차에서는 앞의 기둥을 소피아가 먼저 알아챘어요. 함께 지낸 시간이 길어도 두 사람이 같은 상황을 똑같이 살피는 건 아니에요."},{"title":"오늘은 가까운 데서 사자는 말이 서운할 때","body":"두 분은 주말마다 한 사람의 집에서 같이 밥을 해 먹으려고 늘 같은 가게에서 **장을 봐요**. 그 집에 사는 분이 쌀이 얼마나 남았는지 보고 장보기 목록을 적어 두면, 다른 분은 무거운 짐을 같이 들어 줘요. 어느 주말에는 한 분이 “오늘은 우유랑 달걀뿐인데 집 앞에서 사자”라고 해요. 다른 한 분은 “늘 가던 데 가면 되잖아”라고 답해요. 그분은 쌀이 떨어지기 전에 오늘 사 둘 생각이었어요.\n\n가게를 바꾸자고 한 분은 필요한 것만 빨리 사서 두 사람의 시간을 아끼고 싶었어요. 늘 가던 곳을 택한 분은 이번에도 미리 챙겨 두려던 일을 귀찮게 여긴 것 **같아 서운해요**. 서로를 챙기려던 두 사람이 정작 오늘 뭘 사러 가는지는 함께 확인하지 않았어요.\n\n늘 가던 가게에 가고 싶은 이유가 음식인지, 그곳에서 보내는 시간인지 **말해 보세요**. 그래야 가까운 곳으로 바꿔도 무엇을 함께하고 싶은지는 알 **수 있어요**."},{"title":"쌀을 챙기는 사람, 시간을 아끼려는 사람","body":"“나는 우유랑 달걀만 사는 줄 알았어. 오늘 같이 살 게 **더 있어?”라고 물어보세요**. 쌀을 사려던 분은 “다음 주에 떨어질 것 같아서 오늘 사 두려고 했어”라고 **말해 보세요**. “쌀 떨어질 때마다 네가 먼저 챙겼구나. 난 오늘 너랑 빨리 장 보고 좀 쉬고 싶었어.” 그 말을 들으면 가까운 가게를 가자는 말에 어떤 마음이 있었는지도 알 수 있어요.\n\n쌀이 오늘 떨어진다면 두 사람이 늘 가던 가게에서 장을 봐요. 며칠 더 먹을 만큼 있다면 오늘은 우유와 달걀만 사도 돼요. 얼마 남았는지 둘 다 모르면 저녁을 차리기 전에 쌀통부터 열어 봐요. 다음번에는 가까운 가게를 제안했던 분이 먼저 살피고 “이번 주까지는 있네. 떨어지기 전에 내가 사 올게”라고 **말해 보세요**. 장을 보는 수고에는 무거운 봉지를 드는 일과 봉지에 무엇을 담을지 기억하는 일이 함께 들어 있어요."}]},{"code":"T31","key":"을무","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-06/을무.md","sha":"a85ded4872afefa84c29b6b8410912d82b272dae","title":"급할 때 먼저 할 일을 맞춰요","work":"성난 군중으로부터 멀리","note":"을목 쪽은 ‘당신’, 무토 쪽은 ‘상대방’이에요. 성향은 원작 행동에 대한 해석이에요. 현대 장면과 대사는 가상이며 전체 명식 개인화는 적용하지 않았어요.","chapters":[{"title":"폭풍이 오자 두 사람이 곡식을 덮어요","body":"### 배스시바를 닮은 당신\n\n**적극성** · **유연함**\n\n날씨 때문에 잠에서 깬 배스시바는 곡식이 걱정돼 **밖으로 나와요**. 이미 곡식 더미를 덮고 있는 가브리엘에게 도울 일이 있는지 **먼저 물어요**. 여기서 **적극성**이 보여요. 가브리엘이 갈대 단을 가져다 달라고 하자 사다리를 올라 한 단씩 건네요. 현장에서 필요한 일을 듣고 바로 움직이는 **유연함**으로 해석할 수 있어요. 당시 배스시바는 트로이와 결혼한 상태예요. 이 장면에서 가브리엘과 함께 나선 목적은 농장의 곡식을 지키는 일이에요.\n\n### 가브리엘을 닮은 상대방\n\n**책임감** · **침착함**\n\n가브리엘은 덮개를 구해 밀 더미 일부를 덮고, 덮개가 모자라자 곡식 단을 **겹쳐 놓아요**. 다른 방법을 찾아 일을 이어 가는 **책임감**이 보여요. 배스시바가 오자 무엇을 옮길지 바로 **알려 줘요**. 급한 중에도 할 일을 구체적으로 말하는 **침착함**으로 볼 수 있어요. 그 역시 번개에 위험을 느껴 한 차례 내려와요. 침착함은 여기서 일을 설명하는 태도를 가리켜요."},{"title":"장소가 취소됐는데 서로 다른 일부터 해요","body":"당신은 모임 준비에 빈틈이 생기면 먼저 나서고, 그날 상황에 맞춰 맡을 **일을 바꿔요**. 상대방은 문제가 생겨도 수습을 이어 가고 복잡한 일에서 무엇이 급한지 **짚어 줘요**. 함께 준비하면 한 사람이 모든 일을 해야 한다는 부담이 줄어요.\n\n친구들과 만나기 한 시간 전에 장소가 취소돼요. 상대방은 대체 장소에 전화하고, 당신은 단체방에 아직 출발하지 말라고 알려요. 그런데 후보 식당에서는 인원수를 알아야 자리를 잡아 줄 **수 있대요**. 상대방이 뒤늦게 **“인원부터 물어봤어야지”라고 해요**. 당신은 친구들의 헛걸음을 막아 줬는데 핀잔부터 들은 것 같아요. 상대방은 식당에 다시 전화할 시간을 놓칠까 조급해요. 각자 바로 움직이면서 예약에 어떤 정보가 필요한지는 말하지 못했어요."},{"title":"친구들의 답을 모아 예약 가능 시간을 확인해요","body":"상대방은 “출발하지 말라고 알려 **줘서 다행이야**. 아까 말이 날카로웠어. 식당에서 지금 인원수를 달래”라고 말해요. 당신은 “그럼 내가 단체방에서 인원 확인할게. 너는 몇 명까지 가능한지 알아봐 줘”라고 답해요.\n\n당신은 친구들에게 15분 안에 참석 여부를 알려 **달라고 해요**. 상대방은 식당에 몇 시까지 인원을 알려 줘야 하는지와 비용을 물어요. 식당이 기다려 줄 수 있으면 15분 뒤에 두 사람이 답을 맞춰 봐요. 인원이 불확실하거나 모두 앉을 곳이 없으면 오늘 모임은 미뤄요. 당신이 친구들에게 변경을 알리고, 상대방은 식당에 예약하지 않겠다고 전해요."}]},{"code":"T07","key":"갑갑","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-01/갑갑.md","sha":"21eba4d26653619a79b97537659e64f25247a28e","title":"같이 공부해도 점수는 따로 볼 수 있어요","work":"빨간 머리 앤","note":"두 인물의 관점을 함께 읽어요. 두 분 중 누구에게도 배역을 정하지 않아요. 성향은 인물의 행동을 바탕으로 읽었어요. 현대 생활 장면과 대사는 가상이며, 전체 명식에 따른 개인화는 적용하지 않았어요.","chapters":[{"title":"앤과 길버트가 목표를 좇는 방식","body":"### 앤의 관점\n\n**독립심** · **승부욕**\n\n앤은 장학금을 받아 대학에 가겠다는 **목표를 세워요**. 마릴라 곁에 남기로 한 뒤에도 교사가 되고 집에서 공부를 이어 갈 **계획을 직접 세워요**. 형편이 달라져도 자신이 할 일을 고르는 **독립심**이 보여요.\n\n앤은 퀸스에서 길버트와 성적을 놓고 **경쟁하며 꾸준히 공부해요**. 상대가 잘할수록 자신도 잘하고 싶은 **승부욕**을 볼 수 있어요. 경쟁은 공부할 힘이 되지만, 둘이 함께 준비할 때도 성적을 계속 비교하면 조언을 편하게 듣기 어려워질 **수 있어요**.\n\n### 길버트의 관점\n\n**성실함** · **너그러움**\n\n길버트도 퀸스에서 앤과 경쟁하며 학업을 이어 가고 **금메달을 받아요**. 같은 목표를 두고 꾸준히 노력하는 **성실함**을 볼 수 있어요. 그 성실함이 상대의 공부 방법까지 정해 줘야 **한다는 뜻은 없어요**.\n\n길버트는 앤이 마릴라 곁에 머물 수 있게 애번리 교직을 물러나고 다른 학교에서 **일하기로 해요**. 상대의 사정을 고려해 자기 계획을 조정하는 **너그러움**입니다. 이때 두 사람은 친구가 돼요. 도움을 주는 사람이 자기 일정과 부담을 감당할 수 있는지도 중요해요."},{"title":"풀이를 알려 줬는데 평가로 들릴 때","body":"같은 자격시험을 준비하는 연인은 서로 모르는 문제를 설명해 줄 **수 있어요**. 함께 정한 시간에 꾸준히 공부하면 혼자 할 때보다 계획을 지키기도 쉬워요.\n\n모의고사를 본 날, 점수가 높은 사람이 상대의 답안지를 보며 “이 문제는 이렇게 풀면 쉬워”라고 해요. 점수가 낮았던 사람은 “나도 알아”라고 답하고 답안지를 덮어요. 먼저 말을 꺼낸 사람은 도움을 주려다 무안을 당했다고 느껴요. 듣는 사람은 혼자 다시 풀어 보기도 전에 실력을 평가받는 기분이에요."},{"title":"같이 볼 문제부터 정하기","body":"다음 공부 시간에 답안지를 펴기 전에 **말해 보세요**. “점수는 오늘 얘기하고 **싶지 않아**. 12번만 같이 보고 싶어.” 설명했던 사람은 “네가 어디까지 풀었는지 먼저 보여 줄래?”라고 물을 수 있어요.\n\n도움을 받을 사람이 문제와 범위를 정하면 혼자 풀어 보고 싶은 부분을 지킬 수 있어요. 설명할 사람도 자신이 잘 아는 풀이를 필요한 만큼 나눌 수 있어요. 둘 중 한 명이라도 집중해서 혼자 풀고 싶으면 그날은 따로 공부하세요. 다음에 함께 공부할 때도 점수를 공유할지는 먼저 물어보면 됩니다."}]},{"code":"T20","key":"갑기","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-01/갑기.md","sha":"0c08286e6050bd4f1c75849cf88fca8a0a4e93f1","title":"결혼할 마음과 준비할 시간을 같이 말해요","work":"사일러스 마너","note":"이 글에서 갑목 쪽은 ‘당신’, 기토 쪽은 ‘상대방’입니다. 성향은 인물의 행동을 바탕으로 읽었어요. 현대 생활 장면과 대사는 가상이며, 전체 명식에 따른 개인화는 적용하지 않았어요.","chapters":[{"title":"에피와 애런이 결혼을 생각할 때","body":"### 에피를 닮은 당신\n\n**뚜렷한 주관** · **깊은 애정**\n\n에피는 생부가 자기 집으로 오라고 권하자, 자신을 키워 준 사일러스 **곁에 남겠다고 해요**. 더 풍족하게 살 수 있다는 제안을 듣고도 원하는 생활을 직접 고르는 **뚜렷한 주관**이 보여요.\n\n에피는 애런과 결혼하더라도 사일러스와 함께 살며 돌보고 **싶다고 말해요**. 익숙한 생활과 자신을 키워 준 사람을 소중히 여기는 **깊은 애정**입니다. **에피는 지금 생활을 오래 이어 가고 싶다고 애런에게도 말해요.** 기존 생활을 지키고 싶은 마음이 크면 새 계획의 시점을 두고 상대와 의견이 갈릴 수 있어요.\n\n### 애런을 닮은 상대방\n\n**현실 감각** · **성급함**\n\n애런은 정원 일감이 늘었다며 결혼 이야기를 꺼내고 사일러스까지 셋이 함께 **살자고 제안해요**. 결혼 뒤 수입과 가족이 살 곳을 함께 생각하는 **현실 감각**을 볼 수 있어요.\n\n에피의 말에 따르면 애런은 자신을 아낀다면 같은 때에 결혼하고 싶어야 한다고 **말했고, 에피는 울었어요**. 생활을 준비하는 일과 상대가 결정할 시간을 주는 일은 함께 필요해요. 자기 준비가 끝나자 상대도 같은 답을 해야 한다고 본 데서 **성급함**이 드러납니다."},{"title":"결혼 날짜를 말하자 가족 돌봄이 걱정될 때","body":"가족이 겪을 변화를 먼저 살피는 사람과 집이나 생활비를 구체적으로 알아보는 사람은 결혼 준비에서 서로를 **도울 수 있어요**. 다만 각자 준비가 끝났다고 느끼는 시점은 다를 수 있어요.\n\n상대방이 “올가을에는 집을 **합치자”고 해요**. 당신은 지금 가족의 병원 방문에 동행하고 있어, 이사 뒤에도 누가 같이 갈 수 있을지 알아보고 싶어요. “가을은 좀 어려울 것 같아”라고만 답하자 상대방이 “결혼하고 싶은 건 맞아?”라고 물어요. 상대방은 준비할 일이 뭔지 모르니 기한 없이 기다리는 기분이고, 당신은 함께할 뜻까지 의심받는 것 같아요."},{"title":"날짜를 정하기 전에 돌봄 계획 확인하기","body":"당신은 “결혼하고 싶어. 이사하면 병원 가는 날에 누가 동행할 수 있을지 먼저 알아보고 **싶어”라고 말해 보세요**. 가족에게 필요한 도움과 원하는 방식을 물어보고, 상대방은 두 사람이 고려하는 지역에서 병원까지 걸리는 시간을 확인할 **수 있어요**.\n\n가족을 챙기려는 사람은 실제로 필요한 도움을 파악할 수 있고, 일정을 잡으려는 사람은 무슨 답을 기다리는지 **알게 됩니다**. 이번 주말에 알아본 내용을 함께 보세요. 가을까지 계획을 세우기 어렵다면 이사 시점을 미루고, 집은 두 사람이 시기에 합의한 뒤 계약하세요."}]},{"code":"T33","key":"갑임","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-02/갑임.md","sha":"8a9629a23d4ce055164f3951045a8f8fa887e90c","title":"같이 살기 전에 집세와 일정을 어떻게 의논할까요?","work":"푸른 성","note":"갑목 쪽은 ‘당신’, 임수 쪽은 ‘상대방’입니다. 성향은 인물의 행동에서 읽었어요. 현대 장면과 대사는 가상이며 전체 명식 개인화는 적용하지 않았어요.","chapters":[{"title":"발랜시의 청혼과 바니가 내건 조건","body":"### 발랜시를 닮은 당신\n\n**독립심** · **적극성**\n\n발랜시는 가족에게 돌아가지 않기로 하고 바니에게 **직접 청혼해요**. 가족이 기대하는 생활을 따르기보다 어디서 누구와 살지 스스로 정하려는 **독립심**, 원하는 생활을 먼저 제안하는 **적극성**이 보여요. 당시 발랜시는 의사의 편지 때문에 살 날이 얼마 남지 않았다고 믿었고, 바니에 대해 아는 게 거의 없다고 **인정하면서도 결혼을 제안했어요**. 뜻이 분명할수록 서둘러 결정을 내리기 쉬운 면도 드러나요.\n\n### 바니를 닮은 상대방\n\n**자유로움** · **경계심**\n\n바니는 결혼해도 자신이 사는 섬을 떠날 생각이 **없다고 말해요**. 결혼 뒤에도 원하는 방식으로 살려는 **자유로움**이 드러나요. 숨기고 싶은 일은 묻지 말고 편지도 보여 달라고 **하지 말라고 해요**. 사적인 일을 쉽게 드러내지 않는 **경계심**을 읽을 수 있어요. 발랜시도 섬에서 살고 싶어 했지만, 바니에 대해 모르는 부분까지 감수해야 했어요."},{"title":"일 얘기를 아끼다가 집세도 묻기 어려워질 때","body":"당신이 먼저 같이 살자고 하자 상대방도 반가워해요. 상대방이 집을 합쳐도 각자 혼자 쉴 수 있는 공간은 있었으면 좋겠다고 말하니 당신도 **편하게 느껴요**. 같이 살자는 제안 덕분에 두 사람이 어떤 집을 원하는지 구체적으로 이야기할 수 **있게 됐어요**.\n\n집을 알아보던 중 상대방이 “일 얘기는 자세히 안 하고 싶어”라고 해요. 당신은 상대방의 수입이 달마다 달라 상대방이 집세를 어느 정도까지 낼 수 있는지 궁금하지만, 일을 캐묻는 것처럼 들릴까 봐 비용 얘기까지 접어요. 상대방은 그 뒤에도 당신이 매물을 보내자 비용도 괜찮은 **줄 알아요**.\n\n동거 날짜부터 정하면 집세가 부담스러워도 뒤늦게 말하기 어려워요. 계약 전에 월세와 공과금을 누가 얼마씩 낼 수 있는지 **계산해 보세요**."},{"title":"각자 낼 수 있는 금액으로 매물 고르기","body":"보내 둔 매물부터 같이 보면서 각자 수입이 적은 달에도 낼 수 있는 월세와 관리비의 상한을 **적어 보세요**. “거래처나 수입 내역은 몰라도 돼. 한 달에 집세로 얼마까지 낼 수 있는지가 궁금해”라고 물으면 상대방은 지키고 싶은 사생활을 지키면서 공동생활에 필요한 정보를 줄 수 있어요. 당신도 같이 살자는 제안을 구체적인 집 조건으로 발전시킬 수 있고요.\n\n수입 내역을 어디까지 보여 줄지는 **각자 정해요**. 같이 볼 숫자는 매달 낼 수 있는 월세와 관리비, 지금 보증금에 보탤 수 있는 금액이면 돼요. 창이 마음에 들거나 동네가 익숙해도 두 조건 가운데 하나가 맞지 않으면 후보에서 빼요. 아직 자기 몫을 정하기 어렵다면 지금 사는 집을 유지한 채 언제 다시 숫자를 볼지 약속해요. 같이 살자는 제안을 받아들인 뒤에도 어떤 생활을 함께 꾸릴지는 천천히 정할 수 있어요."}]},{"code":"T09","key":"을경","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-05/을경.md","sha":"f44f91aa66758c58d73b70cc4fc3c70736494ee9","title":"친구의 지적을 듣고 무엇을 바꿀지 정해요","work":"에마","note":"을목 쪽은 ‘당신’, 경금 쪽은 ‘상대방’이에요. 성향은 원작 행동에 대한 해석이며 현대 장면과 대사는 가상이에요. 전체 명식 개인화는 적용하지 않았어요.","chapters":[{"title":"에마가 한 농담을 나이틀리가 짚어 줄 때","body":"### 에마를 닮은 당신\n\n**유연함** · **자기성찰**\n\n에마는 박스힐 모임에서 베이츠 양의 **수다를 농담거리로 삼아요**. 나이틀리의 지적을 받은 뒤 다음 날 일찍 베이츠 **양을 찾아가요**. 불편한 말을 듣고도 이전과 다르게 행동하는 **유연함**이 보여요. 자신이 그동안 베이츠 양을 업신여겼던 태도까지 돌아보는 **자기성찰**도 드러나요. 처음부터 상대를 잘 배려한 행동은 아니며, 방문 한 번으로 상처가 모두 없어졌다고 볼 수도 없어요.\n\n### 나이틀리를 닮은 상대방\n\n**원칙성** · **솔직함**\n\n나이틀리는 베이츠 양이 가난하고 에마보다 나이가 많으며, 에마가 다른 사람들의 태도에도 영향을 줄 수 **있다고 말해요**. 친한 사람의 농담이라도 약한 처지의 사람에게 미칠 영향을 따지는 **원칙성**이 보여요. 에마가 싫어할 것을 알면서 잘못을 직접 짚는 **솔직함**도 있어요. 이 장면에서 타당한 비판을 했다고 해서 다른 일에서도 늘 옳거나 에마를 감독할 권한이 **생기는 것은 아니에요**."},{"title":"고치면 좋겠다는 말이 나를 깎아내리는 말처럼 들릴 때","body":"당신은 상대방이 불편하다고 한 일을 듣고 약속 방식을 바꿔 **주곤 해요**. 상대방은 당신과는 어긋난 일을 다시 의논할 **수 있어 좋아요**. 상대방도 친한 사이에서 무례한 말이 나오면 그냥 넘기지 않아요. 당신은 자기 편의를 위해서만 판단하지 않는 점을 믿어요.\n\n모임에서 당신이 친구의 예전 실수를 농담으로 꺼내요. 돌아오는 길에 상대방이 “그 얘기 뒤에 친구가 말이 없어졌어”라고 해요. 당신은 모두 웃었으니 괜찮았다고 답하지만, 집에 와서는 친구의 표정이 **마음에 걸려요**. 다시 생각할수록 부끄러워 상대방의 말도 더 듣고 싶지 않아요. 상대방은 당신이 농담을 계속해도 된다는 뜻으로 답한 줄 알고 지적을 반복해요. 친구에게 확인할 일보다 두 사람의 말다툼이 커져요.\n\n지적이 막연하면 어떤 일을 고쳐야 하는지 알기 어려워요. 가장 불편했던 말이나 행동을 하나만 짚어 달라고 **해 보세요**."},{"title":"지적은 한 행동에 한정하고 사과는 직접 해요","body":"당신은 “친구가 불편했을 **수도 있겠어**. 민망해서 괜찮다고 우겼어. 내가 직접 연락할게”라고 말할 수 있어요. 상대방은 “그 얘기를 사람들 앞에서 꺼낸 게 걱정됐어”라고 문제였던 행동만 짚고, 당신의 성격 전체를 평가하는 말은 멈춰요.\n\n다음 날 친구에게 직접 연락해요. “어제 사람들 앞에서 네 실수를 얘기했어. 미안해. 다음 모임에서 다시 나오면 내가 그 얘기를 멈출게.” 답장이 늦어도 대수로운 일은 아니었다고 확인받으려 애쓰지 마세요. 다음 모임에서 친구의 실수가 다시 농담이 되면, 상대방이 옆에 없어도 “그 얘기는 여기서 그만하자”라고 **말해 보세요**. 친구는 사과했던 말이 모임에서도 지켜지는지 볼 수 있어요."}]},{"code":"T22","key":"을을","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-06/을을.md","sha":"d1c638d1432ea8a46accaf5aa8f98b2bfb16ce75","title":"친구의 말 뒤에 서로의 답을 들어요","work":"오만과 편견","note":"두 분 모두 제인과 빙리의 관점을 함께 읽어요. 개인별 배역은 정하지 않아요. 성향은 원작 행동에 대한 해석이에요. 현대 장면과 대사는 가상이며 전체 명식 개인화는 적용하지 않았어요.","chapters":[{"title":"제인이 드러낸 호감과 빙리가 믿은 판단","body":"### 제인 베넷의 관점\n\n**신중함** · **온화함**\n\n제인은 사람들 앞에서 빙리 이야기를 조심스럽게 하다가 엘리자베스와 단둘이 있을 때 그가 마음에 **든다고 말해요**. 표현을 서두르지 않는 **신중함**으로 볼 수 있어요. 빙리의 누이들도 이야기해 보면 좋은 사람들이라고 말해요. 사람에게서 좋은 점을 먼저 살피는 **온화함**이에요. 제인이 호감을 일부러 숨기려 했는지는 알 **수 없어요**. 가까운 엘리자베스와 다아시는 제인의 표현을 다르게 읽어요.\n\n### 찰스 빙리의 관점\n\n**사교성** · **유연함**\n\n빙리는 무도회에서 사람들과 곧 어울리고 여러 **곡을 춰요**. 낯선 자리에도 쉽게 섞이는 **사교성**이 보여요. 이후 제인이 자신을 좋아하지 않는다는 다아시의 판단을 받아들여요. 가까운 이의 의견을 들을 수 있다는 점에서 **유연함**으로 읽을 수 있지만, 그 의견에 지나치게 기대는 모습도 함께 보여요. 다아시는 나중에 자기가 제인의 마음을 잘못 판단했다고 빙리에게 말해요. 빙리는 제인을 **다시 찾아가 청혼해요**."},{"title":"다음에도 만나고 싶은지 둘 다 확신이 없어요","body":"처음 만난 자리에서 대화를 편하게 이끄는 사람이 있으면 **긴장이 풀려요**. 말을 재촉하지 않고 천천히 가까워질 시간을 주는 사람과도 편안할 **수 있어요**. 두 모습은 한 사람에게서 번갈아 나타날 수 있어요.\n\n몇 번 데이트한 뒤 한 사람이 친구에게서 “그 사람 원래 누구한테나 친절해”라는 **말을 들어요**. 지난 데이트에서 상대가 자기 이야기를 잘 들어 준 게 좋았지만, 그 말을 듣고 보니 자기만 다음 만남을 기대하는 **것 같아요**. 다른 사람은 지난번에 즐거웠다는 말도 짧게 했어요. 부담을 줄까 봐 이번에는 상대가 먼저 연락하기를 기다려요. 며칠이 지나자 두 사람 모두 상대가 마음을 접었다고 짐작해요."},{"title":"다음에 만나고 싶은지 한 번 직접 물어요","body":"두 사람 중 먼저 이야기할 준비가 된 사람이 “지난번에 같이 보낸 시간이 좋았어. 이번 주에 한 번 **더 만날래?”라고 물어봐요**. 다른 사람도 다시 만나고 싶다면 “나도 좋았어. 부담 줄까 봐 먼저 말을 못 했어”라고 자기 경험을 말해요. 이번 주가 어렵지만 만나고 싶다면 가능한 날을 하나 제안해요.\n\n답을 바로 정하기 어렵다면 주말까지 알려 주겠다고 말하고, 그동안 약속을 잡아 **두지는 않아요**. 상대가 더 만나고 싶지 않다고 하면 그 답을 받아들여요. 답이 오지 않아도 친구에게 대신 물어보거나 기다리던 시간을 계속 비워 둘 필요는 없어요."}]},{"code":"T35","key":"기기","ref":"efcee07c1c813251ac29cc6e322249cae79a28f9","path":"prose-reset-round-2/manuscripts/기기.md","sha":"c6c5dd8c56e81c40f0b8bec173ed9dfdba5e92c8","title":"서로 챙기다 생활비가 부족해졌을 때","work":"현자의 선물","note":"동일 일간인 두 분은 델라와 짐의 관점을 함께 읽으며 개인별 배역을 지정하지 않아요. 아래 성향은 원작 행동에 대한 해석이고 실제 전체 명식 개인화는 적용하지 않았습니다. 현대 생활 장면과 대사는 가상입니다.","chapters":[{"title":"델라와 짐이 선물을 준비하는 방법","body":"### 델라의 관점\n\n**알뜰함** · **결단력**\n\n델라는 적은 돈을 조금씩 아껴 모으지만 짐에게 줄 선물을 **사기에는 부족해요**. 평소 지출을 줄이고 돈을 모은 행동에서 **알뜰함**을 볼 수 있어요. 다만 알뜰한 사람도 소중한 사람에게 쓰는 돈은 평소와 다르게 판단할 **수 있어요**.\n\n델라는 결국 자신의 머리카락을 팔고 짐의 시계에 달 **사슬을 삽니다**. 원하던 선물을 위해 큰 결정을 실행하는 **결단력**이 보여요. 원작에는 그 결정을 짐과 함께 의논한 장면이 나오지 않아요. 상대를 기쁘게 하고 싶은 마음이 커도 자신이 감당할 수 있는 희생인지 돌아볼 필요가 있어요.\n\n### 짐의 관점\n\n**세심함** · **너그러움**\n\n짐은 델라가 바라던 빗을 기억하고 선물로 준비해요. 상대가 원하는 물건을 기억하는 **세심함**이 있어요. 그런데 빗을 사기 위해 자신의 시계를 팔았어요. 델라가 사 온 사슬도, 짐이 사 온 빗도 바로 쓰기 어렵게 됩니다.\n\n짐은 선물을 잠시 두고 식사하자고 해요. 일이 예상대로 되지 않아도 델라를 탓하지 않는 **너그러움**으로 볼 수 있어요. 그렇다고 원작에서 두 사람이 생활비 문제까지 함께 해결했다고 볼 **수는 없어요**. 두 분도 상대를 잘 챙긴다는 자신감과 공동 지출을 의논하는 습관은 따로 **확인해야 해요**."},{"title":"서로를 생각했는데 둘 다 많이 썼을 때","body":"상대가 좋아할 것을 기억하고 준비해 주면 사랑받는 기분이 들 **수 있어요**. 하지만 각자 정성껏 준비하는 동안 전체 지출을 모르면 생활비가 부족해질 수 있어요. 평소 알뜰하다는 공통점만으로 기념일 예산도 비슷할 것이라고 짐작하기 쉬워요.\n\n기념일에 한 사람은 큰 선물을 사고 다른 사람은 여행을 예약했다고 해 볼게요. 선물을 공개할 때는 둘 다 기쁩니다. 며칠 뒤 다음 달 지출을 **확인하니 생활비가 부족해요**. 한 사람은 “네가 여행까지 준비한 줄은 몰랐어”라고 하고, 다른 사람은 “이제 줄이자고 하면 네 선물이 부담스럽다는 말 같잖아”라고 답해요.\n\n두 사람 모두 상대를 기쁘게 하려 했지만 쓸 수 있는 총액은 함께 정하지 않았어요. 지금 필요한 것은 누가 더 정성을 들였는지 비교하는 일이 아니라, 이미 쓴 돈과 다음 달 꼭 필요한 돈을 확인하는 일이에요."},{"title":"이미 쓴 돈을 확인하고 다음 예산 정하기","body":"“준비해 준 건 고마워. 그런데 둘이 쓴 금액을 합치니 다음 달 생활비가 부족해. 지금 바꿀 수 있는 것부터 보자”라고 이야기해 보세요. 선물을 좋아하는 마음과 지출을 줄여야 한다는 판단을 함께 말할 **수 있어요**.\n\n먼저 선물값과 여행 비용을 합치고, 다음 달 반드시 낼 비용을 확인하세요. 구매하거나 예약한 사람이 각각 변경·환불 가능 여부를 알아보면 됩니다. 아직 취소할 수 있다면 수수료와 돌려받을 금액을 비교해 함께 결정하세요. 환불이 어렵다면 부족한 금액을 어떻게 마련할지 의논하되, 한 사람이 혼자 감당하기로 넘기지 마세요.\n\n다음 기념일에는 각자 쓸 금액과 두 사람이 합쳐 쓸 총액을 먼저 **정해 보세요**. 물건이나 장소까지 공개할 필요는 없어요. 예상보다 비싼 것을 준비하고 싶다면 결제하기 전에 다시 의논하면 돼요. 이번에 생활비를 줄여야 했다면 다음 달에도 부담이 남는지 **함께 확인해 주세요**."}]},{"code":"T11","key":"갑계","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-01/갑계.md","sha":"c57bb102ceddf3398586a2228d8e94ac754d946a","title":"예전에 거절한 제안도 지금 답은 다를 수 있어요","work":"설득","note":"이 글에서 갑목 쪽은 ‘당신’, 계수 쪽은 ‘상대방’입니다. 성향은 인물의 행동을 바탕으로 읽었어요. 현대 생활 장면과 대사는 가상이며, 전체 명식에 따른 개인화는 적용하지 않았어요.","chapters":[{"title":"웬트워스와 앤 엘리엇이 다시 뜻을 밝힐 때","body":"### 웬트워스를 닮은 당신\n\n**깊은 애정** · **결단력**\n\n웬트워스는 파혼하고 여러 해가 지난 뒤 앤에게 **편지를 써요**. 여전히 앤을 사랑한다고 직접 밝히는 말에서 **깊은 애정**을 해석할 수 있어요. 그는 앤이 자기 마음을 이미 알아챘으리라고 생각했지만, 앤 역시 그의 **뜻을 확신하지 못했어요**.\n\n그는 앤과 하빌 대위의 대화를 듣고 그 자리에서 편지로 **다시 혼인을 제안해요**. 더 기다리기보다 자기 뜻을 전하는 **결단력**입니다. 오래 기다려 내린 결정이라도 앤이 어떻게 답할지는 물어야 **알 수 있어요**.\n\n### 앤 엘리엇을 닮은 상대방\n\n**신중함** · **자기성찰**\n\n앤은 젊었을 때 믿고 따르던 러셀 부인의 조언을 **받아들여 약혼을 끝냈어요**. 앞날과 주변의 조언을 고려하는 **신중함**이 보여요. 그 선택 때문에 두 사람은 오랫동안 헤어져 지냈어요.\n\n두 사람이 다시 마음을 확인한 뒤 앤은 당시 왜 조언을 따랐는지 **웬트워스에게 설명해요**. 자기 선택의 이유를 다시 살피는 **자기성찰**입니다. 예전에 고민 끝에 내린 결정도 시간이 지나 상황이 바뀌면 다시 **이야기할 수 있어요**."},{"title":"둘 다 같이 보내고 싶은 주말을 놓칠 때","body":"함께하고 싶다는 마음을 한 사람이 먼저 표현하면 상대는 편하게 **답할 수 있어요**. 상대가 혼자 쉴 시간도 중요하게 여긴다면 두 사람 모두 무리 없이 약속을 이어 가기 좋아요.\n\n몇 달 전 당신이 주말에 만나자고 했을 때 상대방은 혼자 쉬고 싶다고 했어요. 이번 주에 상대방이 “요즘 주말에 뭐 해?”라고 물어요. 당신은 또 만나자고 하면 부담스러워할까 봐 “그냥 쉬어”라고 답해요. 상대방은 같이 나갈 생각이었지만 당신이 혼자 있고 싶어 한다고 받아들여요."},{"title":"이번 주말에 원하는 것을 직접 말하기","body":"당신은 “전에는 혼자 쉬고 싶다고 해서 다시 묻기 조심스러웠어. 이번 토요일 낮에는 같이 산책할래?”라고 제안해 보세요. 상대방도 “나도 같이 나가고 싶어서 물었어. 토요일 점심 뒤면 괜찮아”처럼 지금 가능한 시간을 말할 **수 있어요**.\n\n날짜와 활동을 하나씩 고르면 먼저 제안하는 사람은 마음을 분명하게 전할 수 있고, 시간을 두고 생각하는 사람은 실제 일정을 확인하고 답할 수 있어요. 일정이 아직 안 나오면 언제 확인할 수 있는지 **알려 주세요**. 이번에도 혼자 쉬고 싶다는 답을 들으면 주말은 각자 보내고, 다른 날을 제안하고 싶은지는 상대에게 맡겨도 됩니다."}]},{"code":"T24","key":"갑무","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-01/갑무.md","sha":"8dd727cd98ab8f7285c37e73567eae570563395f","title":"집을 알아보기 전에 함께 살 뜻부터 확인해요","work":"성난 군중으로부터 멀리","note":"이 글에서 갑목 쪽은 ‘당신’, 무토 쪽은 ‘상대방’입니다. 성향은 인물의 행동을 바탕으로 읽었어요. 현대 생활 장면과 대사는 가상이며, 전체 명식에 따른 개인화는 적용하지 않았어요.","chapters":[{"title":"배스시바와 가브리엘이 결혼 제안을 다르게 볼 때","body":"### 배스시바를 닮은 당신\n\n**독립심** · **솔직함**\n\n배스시바는 가브리엘이 결혼 뒤의 생활을 이야기하자 마음에 **드는 점은 인정해요**. 그래도 자신이 그와 결혼하고 싶은지를 **생각한 뒤 거절해요**. 중요한 선택을 자기 뜻에 따라 하는 **독립심**을 볼 수 있어요.\n\n배스시바는 가브리엘이 기다리는 답과 달라도 결혼하고 싶지 않다고 **직접 말해요**. 원하는 바를 알리는 **솔직함**입니다. 좋았던 조건을 이야기할 때는 제안 자체에 어떻게 답하는지도 말해야 상대가 뜻을 **알 수 있어요**.\n\n### 가브리엘을 닮은 상대방\n\n**책임감** · **고집스러움**\n\n가브리엘은 청혼하면서 장에 갈 때 쓸 마차와 집에서 함께 **보낼 시간을 이야기해요**. 결혼한 뒤에도 자기가 맡고 싶은 일을 구체적으로 떠올리는 모습에서 **책임감**을 해석할 수 있어요. 이 장면에서 말한 것은 앞으로의 계획이에요.\n\n배스시바가 생각할 시간을 달라고 한 뒤에도 가브리엘은 함께 살면 어떤 점이 **좋을지 계속 설명해요**. 거절을 듣고도 다시 생각해 보라고 권해요. 이미 마음먹은 제안을 놓기 어려워하는 **고집스러움**이 보여요. 좋은 점을 더 설명해도 상대가 그 생활 자체를 원하지 않을 **수 있어요**."},{"title":"집이 좋다는 말이 동거에 동의한다는 말로 들릴 때","body":"한 사람이 보증금과 출퇴근 시간을 알아보고 다른 사람이 자기 생활에서 중요한 점을 말하면 두 사람에게 맞는 **집을 찾기 쉬워요**. 함께 살고 싶은지부터 의견이 다르면 같은 준비가 부담이 될 수 있어요.\n\n상대방이 찾은 집을 보고 당신은 “역이 가까운 건 좋네. 그래도 아직 같이 살고 싶지는 않아”라고 해요. 상대방은 “그럼 보증금이 더 싼 집으로 다시 찾아볼까?”라고 물어요. 상대방은 걸리는 조건을 해결하면 될 거라고 보고, 당신은 따로 살고 싶다는 말이 전달되지 않아 답답해요."},{"title":"집 찾기를 멈추고 지금 원하는 생활 말하기","body":"당신은 “좋은 집을 찾아 **줘서 고마워**. 지금은 각자 집에서 지내고 싶어”라고 **말해 보세요**. 상대방은 “조건을 바꿔 보면 될 줄 알았어. 이번에는 집 찾는 걸 멈출게”라고 답할 수 있어요.\n\n답을 분명히 말하면 자기 생활을 지키려는 사람은 원치 않는 집을 계속 비교하지 않아도 돼요. 준비하는 데 익숙한 사람은 당장 무엇을 멈추면 되는지 알 수 있어요. 이번 주에는 평소처럼 만날 날을 정하세요. 동거를 다시 논의할 날짜는 두 사람 모두 원할 때 잡고, 그전에는 방문이나 계약을 잡아 두지 마세요."}]},{"code":"T37","key":"갑병","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-01/갑병.md","sha":"93e5a6cfe2b06d262f448309c0d10298e2261ae2","title":"고마운 도움과 여행에 대한 답은 따로 말해요","work":"빨간 머리 앤","note":"이 글에서 갑목 쪽은 ‘당신’, 병화 쪽은 ‘상대방’입니다. 이 장면의 앤과 길버트는 친구가 됩니다. 성향은 인물의 행동을 바탕으로 읽었어요. 현대 생활 장면과 대사는 가상이며, 전체 명식에 따른 개인화는 적용하지 않았어요.","chapters":[{"title":"길버트의 양보와 앤의 대답","body":"### 길버트를 닮은 당신\n\n**뚜렷한 주관** · **사려 깊음**\n\n길버트는 애번리 교직을 물러나는 대신 화이트샌즈에서 **가르치겠다고 해요**. 자기 일도 계속할 방법을 고르는 **뚜렷한 주관**으로 해석할 수 있어요. 자신의 계획을 바꿀 때는 어느 정도까지 바꿀 수 있는지 **살피는 게 중요해요**.\n\n그는 앤이 애번리에서 가르치면 마릴라와 집에서 함께 지낼 수 **있다는 사정을 생각했어요**. 상대의 형편을 고려해 도움을 주는 **사려 깊음**이 보여요. 도움을 주고 나면 상대가 그 도움을 어떤 의미로 받아들였는지 궁금할 **수 있어요**.\n\n### 앤을 닮은 상대방\n\n**솔직함** · **신중함**\n\n앤은 길에서 길버트를 만나 교직을 양보해 줘 고맙다고 **직접 말해요**. 오래 말을 섞지 않았던 상대에게도 감사를 전하는 **솔직함**입니다.\n\n**두 사람은 그 자리에서 친구가 되기로 해요.** 앤이 그날 실제로 받아들인 관계를 기준으로 보면, 고마움을 전하면서 서로 편하게 지낼 방법을 고르는 **신중함**을 읽을 수 있어요. 앤이 속으로 연애를 검토했다는 근거는 이 장면에 없어요. 호의를 받았을 때 당장 어떤 답까지 할 수 있는지 살피는 정도로 참고할 수 있어요."},{"title":"여행 제안을 받고 대답이 어려워질 때","body":"한 사람이 상대의 일을 도와주고 다른 사람이 무엇이 도움이 됐는지 말해 주면 서로의 수고를 알아차리기 쉬워요. 그 뒤에 새로운 부탁이나 제안이 나오면 감사와 그 제안에 대한 답이 섞일 **수 있어요**.\n\n당신은 상대방이 새 일을 준비하는 동안 주말마다 자료를 **같이 봐 줬어요**. 일이 끝나자 “다음 휴가 때 같이 여행 갈래?”라고 물어요. 상대방은 혼자 쉬고 싶지만 거절하면 지난 도움도 고맙게 여기지 않은 것처럼 보일까 봐 답을 미뤄요. 당신은 일정도 잡을 수 없고 제안에 관심이 없는 것 같아 서운해집니다."},{"title":"여행 예약을 멈추고 원하는 휴가 확인하기","body":"상대방은 “자료 같이 봐 줘서 정말 고마웠어. 이번 휴가는 혼자 쉬고 **싶어”라고 말해 보세요**. 당신은 “같이 가고 싶어서 아쉽지만, 이번엔 각자 쉬자”라고 답하고 예약을 멈출 **수 있어요**. 일정이 아직 확실하지 않다면 언제까지 답할 수 있는지 말하고 그때까지 기다리세요.\n\n고마웠던 일을 구체적으로 말하면 상대를 챙겼던 사람은 자기 도움이 어떻게 받아들여졌는지 알 수 있어요. 조심스러운 사람은 원하는 휴가를 솔직하게 말하기 쉬워집니다. 지난 지원이 부담스러웠다면 여행 이야기와 따로 시간을 잡아 말하세요. 다음에 자료를 같이 볼 때는 몇 시간까지 가능한지 정하고 시작할 수 있어요."}]},{"code":"T13","key":"갑을","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-01/갑을.md","sha":"aa60a580c2a65f3ff87d122b442f934ca25ec22a","title":"진지한 메시지에 농담이 돌아왔을 때","work":"뜻대로 하세요","note":"이 글에서 갑목 쪽은 ‘당신’, 을목 쪽은 ‘상대방’입니다. 성향은 인물의 행동을 바탕으로 읽었어요. 현대 생활 장면과 대사는 가상이며, 전체 명식에 따른 개인화는 적용하지 않았어요.","chapters":[{"title":"올랜도와 로절린드가 마음을 표현하는 방식","body":"### 올랜도를 닮은 당신\n\n**솔직함** · **적극성**\n\n올랜도는 자크가 로절린드를 사랑하느냐고 **묻자 인정해요**. 주변의 놀림에도 자기가 좋아하는 사람을 숨기지 않는 **솔직함**이 보여요.\n\n올랜도는 로절린드를 생각하며 지은 시를 **숲의 나무에 걸어요**. 마음이 생기면 표현할 방법부터 찾는 **적극성**으로 볼 수 있어요. 표현하는 일이 편한 사람도 상대가 똑같은 방식과 분량으로 답하리라고 기대하면 서운해질 **수 있어요**.\n\n### 로절린드를 닮은 상대방\n\n**유연함** · **재치**\n\n로절린드는 가니메데로 변장한 **채 올랜도를 만나요**. 자신을 로절린드라고 부르고 구애해 보라고 제안해요. 자기 정체를 밝히기 어려운 상황에서 다른 방식으로 대화를 시작하는 **유연함**이 보여요. 이 희극에서는 올랜도가 상대의 정체를 모르는 상태에서 이야기가 진행돼요.\n\n로절린드는 숲에 시를 건 남자를 치료해 줄 수 있다며 **농담을 건네요**. 진지한 주제를 장난스러운 말로 꺼내는 **재치**가 있어요. 이렇게 시작하면 부담을 덜 수도 있지만, 듣는 사람이 농담만으로 상대의 진심을 알아차리기는 어려워요."},{"title":"마음을 전했는데 대답을 못 들었을 때","body":"당신이 애정을 분명히 표현하면 상대방은 당신이 어떻게 생각하는지 **알 수 있어요**. 상대방이 가벼운 말로 긴장을 풀어 주면 진지한 이야기도 시작하기 쉬워질 수 있어요.\n\n당신이 “앞으로도 오래 만나고 싶어”라고 긴 **메시지를 보내요**. 상대방은 쑥스러워서 웃는 그림을 보내고 “갑자기 왜 이렇게 진지해”라고 답해요. 상대방은 대화를 편하게 시작하려 했지만, 당신은 마음을 가볍게 여긴 것 같아 더 말하기 어려워요."},{"title":"농담의 뜻을 설명하고 이야기할 시간을 정하기","body":"당신은 “내가 보낸 말이 어떻게 들렸는지 궁금해. 짧게라도 네 생각을 듣고 싶어”라고 **말해 보세요**. 상대방은 “진지하게 답하려니 쑥스러웠어. 농담으로만 답해서 서운했겠다. 내일 저녁에 통화할래?”라고 말할 **수 있어요**.\n\n구체적으로 무엇을 듣고 싶은지 말하면 솔직한 표현을 좋아하는 사람은 답을 받을 **수 있어요**. 말하기 편한 방법을 고르면 농담으로 긴장을 푸는 사람도 자기 마음을 전할 여유가 생깁니다. 아직 오래 만날지 생각할 시간이 필요하면 그 점을 먼저 알려 주세요. 내일 통화에서는 지금 분명한 마음부터 말하고, 결정이 필요한 이야기는 둘 다 준비됐을 때 이어 가세요."}]},{"code":"T26","key":"경경","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-02/경경.md","sha":"a9ecf75615ba0467ac59bcf35d8c62f94e82cd73","title":"내 취향을 놀리는 농담이 불편할 때","work":"헛소동","note":"두 분 모두 베아트리스와 베네딕의 관점을 함께 읽어요. 개인별 배역은 두지 않았어요. 성향은 인물의 행동에서 읽었어요. 현대 장면과 대사는 가상이며 전체 명식 개인화는 적용하지 않았어요.","chapters":[{"title":"베아트리스와 베네딕이 자기 말을 쓰는 방식","body":"### 베아트리스의 관점\n\n**뚜렷한 주관** · **정의감**\n\n베아트리스는 베네딕과 만나면 그의 말을 그대로 받아넘기지 않고 **재치 있게 맞받아쳐요**. 자기 생각을 거리낌 없이 밝히는 **뚜렷한 주관**이 보여요. 사촌 헤로가 결혼식에서 공개적으로 비난받자 헤로가 모함을 당했다고 말해요. 여러 사람이 비난하는 자리에서도 부당하다고 여긴 일에 목소리를 내는 **정의감**이 드러나요. 다만 날카롭게 응수하는 데 익숙하면 상대가 방어적으로 **듣기 쉬워요**.\n\n### 베네딕의 관점\n\n**자존심** · **유연함**\n\n베네딕은 결혼할 **생각이 없다고 공언해요**. 나중에 베아트리스가 자신을 좋아한다는 말을 엿듣고는 예전에 결혼을 비웃은 일로 놀림을 받을 수도 있다고 생각해요. **자존심**이 걸린 일이지만, 그래도 예전 말을 고집할 이유는 없다고 봐요. 전에 한 말에 매이지 않고 생각을 바꾸는 **유연함**이에요. 다만 그가 엿들은 말은 친구들이 일부러 꾸민 것이었어요."},{"title":"영화 한 편 고르다가 취향을 평가하게 될 때","body":"두 분은 예고편을 보며 한마디씩 보태는 재미로 영화를 같이 **골라 왔어요**. 둘 다 보고 싶은 것과 싫어하는 것을 분명히 말해 **평소에는 결정도 빨라요**.\n\n오늘 한 분이 영화를 추천하자 다른 한 분이 “네 취향이면 또 뻔하겠네”라고 웃어요. 추천한 분도 “너는 고르는 것마다 어렵잖아”라고 받아쳐요. 그러고 나니 둘 다 다시 영화를 **추천하기가 싫어요**. 작품을 고르는 대화에서 서로의 취향을 평가하는 말이 오갔기 때문이에요. 평소 한쪽만 놀림받는 상황을 그냥 넘기기 어려운 사람도, 직접 놀림을 받으면 말을 멈춰 달라고 하기보다 비슷한 말로 받아치기 쉬워요.\n\n영화가 별로라는 말과 그 영화를 고른 사람의 취향이 별로라는 말은 다르게 들려요. 영화에서 아쉬웠던 점을 말하면 취향을 평가하는 말로 번지지 않아요."},{"title":"취향을 평가한 말을 거두고 작품 얘기로 돌아가기","body":"“뻔하다고 한 건 미안해. 예고편을 보니까 결말이 예상돼서 오늘은 다른 걸 보고 **싶어”라고 말해 보세요**. 맞받아친 분도 자기 말을 거두고 “나는 배우가 좋아서 이걸 골랐어”라고 추천 이유를 말할 **수 있어요**. 상대가 사과하기 전에도 자기 표현부터 고칠 수 있어요. 부당하다고 느낀 말에는 “그렇게 말하면 내가 고른 건 보기도 전에 별로라고 하는 것 같아. 둘 다 작품 얘기만 하자”라고 해 보세요. 서로의 추천을 같은 기준으로 다뤄 달라고 말하면, 불편했던 점을 짚으면서도 상대의 취향을 깎아내리지 않을 수 있어요.\n\n“그 영화가 싫어서 그래” 대신 어느 장면을 보기 힘든지 **말해 주세요**. 방금 농담이 지나쳤다고 느낀 분은 예고편을 멈추고 그 말부터 짚어도 돼요. 서로가 고른 영화보다 서로의 취향을 놀리는 쪽으로 대화가 자꾸 흐르면, 오늘은 각자 보고 싶은 것을 봐요. 다음에는 후보를 하나씩만 올려 두고 끌리는 **이유를 들어 보세요**."}]},{"code":"T02","key":"경계","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-02/경계.md","sha":"72e4eb24c0c746140bde564b81fbb94bf838bdaf","title":"더 자주 만나고 싶다는 말을 먼저 꺼내요","work":"설득","note":"경금 쪽은 ‘당신’, 계수 쪽은 ‘상대방’입니다. 성향은 인물의 행동에서 읽었어요. 현대 장면과 대사는 가상이며 전체 명식 개인화는 적용하지 않았어요.","chapters":[{"title":"웬트워스가 쓴 편지와 앤이 풀어 말한 사정","body":"### 웬트워스를 닮은 당신\n\n**결단력** · **솔직함**\n\n웬트워스는 앤 엘리엇이 하빌과 이야기하는 것을 듣다가 그 자리에서 편지를 써 **앤에게 남겨요**. 대화에 직접 끼어들지 않고도 뜻을 전할 방법을 택한 데서 **결단력**을 읽을 수 있어요. 편지에는 여전히 앤을 사랑하며 다시 결혼을 청한다는 뜻을 **분명히 써요**. 그간 앤이 자기 마음을 알아주길 기대했다는 사실도 털어놓아요. 마음을 말할 때 보이는 **솔직함**은 짐작만 하고 기다리던 동안에는 발휘되지 않았어요.\n\n### 앤 엘리엇을 닮은 상대방\n\n**신중함** · **세심함**\n\n두 사람이 다시 뜻을 확인한 날, 앤은 예전에 약혼을 깬 일을 돌아보고 당시 자신이 러셀 부인의 조언을 **따른 이유를 설명해요**. 지난 결정을 충분히 돌아본 뒤 말하는 **신중함**이 보여요. 자신에게는 부모나 다름없는 분의 조언을 따른 이유가 있었지만, 같은 처지의 사람에게 자신이 그런 조언을 하지는 않겠다고 설명해요. 조언의 적절함과 그 말을 따랐던 사정을 구별하는 **세심함**이에요. 시간을 들여 생각해도 상대에게 말하기 전에는 그 이유가 전해지기 어려워요."},{"title":"쉬라는 말과 더 자주 보고 싶다는 말","body":"상대방은 당신이 “이번 주는 정말 힘들었어”라고 말하면 바로 약속을 잡기보다 쉴 시간을 **챙겨 줘요**. 당신이 원하는 게 분명할 때는 먼저 제안해 주니 상대방도 편해요.\n\n이번에는 당신이 더 자주 만나고 싶어서 “요즘 주말이 좀 비네”라고 보내요. 상대방은 당신이 오랜만에 쉰다는 말로 듣고 “이번에는 푹 쉬어”라고 답해요. 당신은 거절당했다고 느끼고 더 말을 **꺼내지 않아요**. 상대방으로서는 만날지 말지 묻는 **말이 없었어요**.\n\n혼자 쉬고 싶어 보인다는 이유로 만나자는 말을 계속 미루면, 상대는 만나기 싫은 줄 알 **수 있어요**. 쉬는 시간을 먼저 묻고 가능한 날을 한두 개 제안해 보세요."},{"title":"빠졌던 제안을 한 문장으로 보내기","body":"“아까 주말이 빈다고 한 건 요즘 네 얼굴을 좀 더 자주 보고 싶어서였어. 나는 한 달에 한두 번은 주말에 같이 점심 먹으면 좋겠어. 넌 어느 정도가 **편해?”라고 물어보세요**. 상대방도 “나는 주말을 통째로 비워 두는 날이 필요해. 격주 일요일 낮이면 좋아”처럼 자기가 지킬 수 있는 간격을 말해요.\n\n달력을 펼쳐 다음 달에 둘 다 편한 날을 한 번만 **골라 봐요**. 만나고 나서 “나는 이렇게 한 번씩 날짜를 정하는 게 편했어. 너는 어땠어?”라고 물어보세요. 한 분은 미리 잡힌 약속이 좋고 다른 분은 일정을 그때그때 보고 싶다면 매달 같은 요일을 비워 둘 필요는 없어요. 다시 보고 싶은 분이 다음 날짜를 직접 제안해요."}]},{"code":"T15","key":"경신","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-02/경신.md","sha":"e000e66db8f8ca08b807315446883cfcd7a759b0","title":"답장이 짧고 일정도 늦게 알려 줬을 때","work":"오만과 편견","note":"경금 쪽은 ‘당신’, 신금 쪽은 ‘상대방’입니다. 성향은 인물의 행동에서 읽었어요. 현대 장면과 대사는 가상이며 전체 명식 개인화는 적용하지 않았어요.","chapters":[{"title":"다아시가 인정한 행동과 엘리자베스가 고친 판단","body":"### 다아시를 닮은 당신\n\n**자기성찰** · **솔직함**\n\n다아시는 편지를 쓸 당시 자신이 침착하다고 여겼지만, 훗날 그 편지에 분한 **마음이 담겼다고 돌아봐요**. 당시의 자기 판단을 다시 살피는 **자기성찰**이에요. 엘리자베스에게는 첫 청혼이 받아들여질 거라고 확신했고 자신이 오만하게 행동했다고 인정해요. 불리한 일도 직접 말하는 **솔직함**이 보여요. 그가 뒤늦게 알아차린 무례함은 엘리자베스가 첫 청혼 때 이미 지적한 일이었어요.\n\n### 엘리자베스를 닮은 상대방\n\n**꼼꼼함** · **뚜렷한 주관**\n\n엘리자베스는 첫 청혼에서 다아시가 자신에게 **무례했다고 지적하고 거절해요**. 상대의 기대에 휘둘리지 않고 자기 판단을 밝히는 **뚜렷한 주관**이 보여요. 뒤에 다아시의 편지를 처음 읽을 때는 그의 설명을 **믿지 않아요**. 하지만 편지를 거듭 읽고 위컴이 전에 했던 말과 자신이 직접 본 일을 되짚으면서 판단을 고쳐요. 자신이 믿고 싶었던 이야기까지 다시 살피는 **꼼꼼함**이에요."},{"title":"짧은 답장과 늦은 통보가 한꺼번에 서운할 때","body":"당신은 설명을 들으면 자기 생각이 틀렸다고 **인정하는 상대방을 믿어요**. 상대방은 당신이 실수한 일을 구체적으로 인정하고 고칠 **때 안심해요**. 다만 서로가 문제 삼는 일이 다르면 한쪽은 이미 해명했다고 생각하고 다른 쪽은 아직 할 말이 남아요.\n\n저녁 약속에 늦게 된 당신이 약속 시각 **직전에 “늦어**. 먼저 들어가”라고 보냅니다. 상대방은 이미 식당 앞이고, 문자가 짧아서 당신이 **화가 났다고 생각해요**. 나중에 당신이 급히 보낸 문자였다고 설명하자 상대방도 이해해요. 그래도 변경을 늦게 알아 밖에서 기다린 일이 불편했다고 하자, 당신은 이미 설명했는데 왜 또 그 얘기를 하나 싶어요.\n\n답장 말투가 걱정됐던 일과 일정이 바뀐 걸 늦게 알린 일은 따로 이야기해 보세요. 말투에 오해가 풀려도 기다린 시간은 남으니까요."},{"title":"오해한 뜻은 바로잡고 늦은 통보는 고치기","body":"상대방은 “화난 줄 알았는데 급해서 짧게 **쓴 거였구나**. 나는 출발 전에 늦는다는 걸 알았으면 **좋았어”라고 말해 보세요**. 짐작을 고치는 꼼꼼함을 살리면서 실제로 불편했던 일을 짚을 수 있어요. 당신은 “늦을 걸 알았을 때 바로 연락했어야 했어. 밖에서 기다리게 해서 미안해”라고 인정할 수 있어요. 왜 짧게 썼는지 설명한 다음, 자신이 바꿀 행동까지 말하는 거예요.\n\n다음에는 몇 분 늦을지 아직 몰라도 먼저 **알려 주세요**. “지금 출발이 밀렸어. 도착할 시간은 15분쯤 뒤에 다시 알려 줄게.” 상대가 이미 나왔다면 더 기다릴지 먼저 밥을 먹을지는 그 사람이 정할 수 있게 해요. 설명을 들은 뒤에 오해는 풀려도 식당 앞에서 보낸 시간은 돌아오지 않아요. 비슷한 일이 반복된다면 늦기 전에 서로 소식을 들을 수 있는 방식부터 바꿔 봐요."}]},{"code":"T28","key":"경임","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-02/경임.md","sha":"f7abce37a047e263af241b6a32f14d5aa981c405","title":"여행비를 반씩 내면 두 사람 다 괜찮을까요?","work":"북과 남","note":"경금 쪽은 ‘당신’, 임수 쪽은 ‘상대방’입니다. 성향은 인물의 행동에서 읽었어요. 현대 장면과 대사는 가상이며 전체 명식 개인화는 적용하지 않았어요.","chapters":[{"title":"손턴이 다시 알아본 일과 마거릿이 물은 사정","body":"### 손턴을 닮은 당신\n\n**원칙성** · **자기성찰**\n\n손턴은 파업을 이야기할 때 고용주가 자기 자본을 어떻게 쓸지 정할 권리가 **있다고 말해요**. 자신이 책임진 일의 결정권과 기준을 뚜렷이 정하는 **원칙성**이 보여요. 그 기준을 앞세우면 노동자가 왜 문제를 제기하는지 **충분히 듣기 어려워요**.\n\n일자리를 부탁하러 온 히긴스에게 퉁명스럽게 대했던 손턴은 나중에 **자신이 부당했다고 여겨요**. 히긴스가 한 말이 사실인지 직접 알아본 뒤 찾아가 **일자리를 주겠다고 해요**. 처음에 자기가 어떻게 대했는지 돌아보고 행동을 바꾸는 **자기성찰**이에요.\n\n### 마거릿을 닮은 상대방\n\n**탐구심** · **공감 능력**\n\n마거릿은 베시가 방직 공장의 면 먼지 때문에 병이 났다고 하자 그 먼지가 뭔지, 피해를 줄일 **방법은 없는지 물어요**. 막연히 짐작하던 노동 환경을 당사자에게 직접 듣는 **탐구심**이 보여요. 베시가 일하면서 겪은 고통을 털어놓을 때는 곁에 무릎을 **꿇고 들어요**. 편하게 듣기 어려운 말에도 자리를 뜨지 않고 베시 곁에 있는 모습에서 **공감 능력**을 읽을 수 있어요. 베시가 이야기해 준 경험은 그 공장과 자신의 일에 관한 것이어서, 마거릿이 다른 노동자의 처지도 이미 안다고 볼 수는 없어요."},{"title":"금액은 같은데 한 사람에게 더 부담스러울 때","body":"두 분은 여행비를 **반씩 내기로 했어요**. 부담할 몫이 분명해서 상대방도 처음에는 편했어요. 숙소 후보를 볼 때 상대방이 두 사람의 이동 시간과 식비까지 챙겨 주는 것도 당신에게는 든든했어요.\n\n그런데 상대방의 **수입이 줄어들어요**. 상대방이 더 저렴한 숙소를 제안하자 당신은 “반씩 내기로 했잖아”라고 답해요. 당신은 한 사람에게 비용이 몰리지 않게 하려 했어요. 상대방도 반씩 내는 데 동의하지만, 처음 예상한 금액은 이제 부담스러워요.\n\n여행비를 정할 때는 숙박비 외에 교통비와 식비도 **더해 보세요**. 각자 낼 수 있는 상한선을 말한 뒤 숙소나 일정을 줄일 수 있어요."},{"title":"반씩 내려면 더 적게 낼 수 있는 쪽에 총액 맞추기","body":"두 사람이 여행에 쓸 수 있는 금액이 각각 20만 원과 12만 원이라면, 반씩 내는 방식으로 쓸 수 있는 총액은 24만 원이에요. 교통비와 식비를 먼저 빼고 남은 금액 안에서 숙소를 고르세요. 당신이 원했던 분담 기준을 지키면서 상대방의 형편도 실제 계산에 반영할 수 있어요.\n\n숙소 후보가 모두 예산을 넘으면 당일치기부터 다시 계산해 봐요. 한 사람이 숙박비를 더 내고 싶다면 그 차액을 그냥 보탤지, 나중에 돌려받을지 예약 전에 얘기해요. 받는 분도 그 조건에서 편하게 여행할 수 있을지 답할 수 있어야 해요. 방 하나를 빨리 잡는 것보다, 돌아온 뒤에도 여행비 때문에 서로 눈치를 보지 않는 쪽으로 이번 계획을 **정해 봐요**."}]},{"code":"T04","key":"기경","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-03/기경.md","sha":"18cb07ac3c78daf1737523df2655c5f729bc080e","title":"서류를 도와주기 전에 어디까지 봐 줄지 물어요","work":"작은 도릿","note":"기토 쪽은 ‘당신’, 경금 쪽은 ‘상대방’입니다. 성향은 원작 속 행동에서 읽었어요. 현대 장면과 대사는 가상이며 전체 명식 개인화는 적용하지 않았어요.","chapters":[{"title":"에이미의 돌봄과 아서의 거절","body":"### 에이미 도릿을 닮은 당신\n\n**다정함** · **성실함**\n\n아서가 빚으로 감옥에 갇혀 앓자 에이미는 찾아가 **곁에 앉아요**. 중간중간 물을 건네고 머리를 편히 댈 수 있게 받쳐 줘요. 상대가 지금 무엇을 필요로 하는지 살피는 **다정함**이 보여요. 이후에도 하루에 적어도 두 **번씩 찾아왔다고 말해요**. 돌봄을 한 번으로 끝내지 않는 **성실함**이에요. 이 방문 횟수는 아서가 아팠던 때의 일이에요. 관계마다 필요한 돌봄의 양은 다를 수 있어요.\n\n### 아서 클레넘을 닮은 상대방\n\n**자존심** · **책임감**\n\n아서는 몸이 약해진 모습을 보이고 싶지 않아 존이 도울 일이 있냐고 물을 때마다 **괜찮다고 해요**. 자기 사정을 드러내기 어려워하는 **자존심**을 읽을 수 있어요. 에이미가 돈을 주거나 빌려주겠다고 하자 자기 형편 때문에 에이미까지 어려워질까 염려해 거절해요. 자신이 진 부담을 상대에게 넘기지 않으려는 **책임감**이에요. 다만 에이미가 기꺼이 감당하겠다고 밝힌 몫도 아서는 희생이라고 여겨요."},{"title":"서류를 같이 보자는 말까지 거절할 때","body":"상대방이 일자리를 잃어요. 당신은 며칠 동안 식사를 챙기고, 지원 마감일에 맞춰 서류도 같이 봐 주겠다고 해요. 상대방은 당신이 작은 필요를 알아차리고 꾸준히 챙겨 줘서 고마워요. 당신도 상대방이 지원 일정과 생활비를 스스로 관리하려는 **점을 믿어요**.\n\n그런데 상대방은 서류 이야기를 꺼낼 때마다 “혼자 할 수 있어”라고 해요. 힘든 모습을 더 보이기 싫고, 부탁을 시작하면 다음 지원까지 맡기게 될까 걱정돼요. 당신은 음식은 받아 주면서 무슨 도움이 필요한지는 말해 주지 않으니, 어떻게 곁에 있어야 **할지 막막해요**.\n\n서류를 함께 본다는 말만으로는 오탈자만 봐 달라는 건지, 내용을 고쳐 달라는 건지 알기 어려워요. 도울 범위를 먼저 물어보면 고쳐 준 부분을 다시 되돌릴 **일이 줄어요**."},{"title":"이번 지원서에서 같이 볼 부분 하나를 정하기","body":"당신은 “내일 저녁에 30분 정도 시간 돼. 같이 보면 편한 부분이 **있어?”라고 물어보세요**. 무엇이 필요한지 먼저 물으면 상대를 챙기는 마음이 실제 도움으로 이어져요. 지킬 수 있는 시간을 정해 두면 당신도 부담 없이 그 약속을 지킬 수 있어요.\n\n“지원서 내용은 내가 쓸게. 보내기 전에 첨부 파일만 같이 봐 줄래?”라고 부탁할 **수 있어요**. 이렇게 말하면 함께할 일이 생기고, 어떤 회사에 무엇을 제출할지는 본인이 정할 수 있어요. 혼자 마치고 싶다는 답이 나오면 그날 저녁을 따로 써요. 도와주는 분도 다음에 다시 부탁받았을 때 자기 일정에 맞춰 답하면 돼요."}]},{"code":"T17","key":"기신","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-03/기신.md","sha":"7aa70bf95166e82bd3fe3f601fa0e983737b2d82","title":"항공권을 사기 전에 날짜부터 확인해요","work":"드라큘라","note":"기토 쪽은 ‘당신’, 신금 쪽은 ‘상대방’입니다. 성향은 원작 속 행동에서 읽었어요. 현대 장면과 대사는 가상이며 전체 명식 개인화는 적용하지 않았어요.","chapters":[{"title":"미나가 정리한 기록과 조너선이 확인한 단서","body":"### 미나 하커를 닮은 당신\n\n**꼼꼼함** · **성실함**\n\n미나는 조너선과 함께 여러 사람의 기록을 날짜순으로 정리해 사건의 순서를 함께 볼 수 **있게 해요**. 자료를 읽을 사람이 어디서부터 살펴야 할지까지 고려하는 **꼼꼼함**이에요. 수어드의 음성 일기까지 듣고 타자로 옮겨 **자료를 보태요**. 손이 많이 가는 작업을 끝까지 해내는 **성실함**도 보여요. 기록 정리는 조사에 참여한 한 방식이에요. 미나가 맡은 일이 기록 정리로만 끝나야 할 이유는 없었어요.\n\n### 조너선 하커를 닮은 상대방\n\n**신중함** · **끈기**\n\n조너선은 상자를 배달한 사람의 **수첩에서 배달지를 확인해요**. 다른 곳으로 간 상자가 있을 가능성도 생각해 다시 **찾아가 물어요**. 확인한 것과 아직 모르는 것을 살피는 **신중함**이에요. 처음 찾아간 사람에게 직접 답을 얻지 못하자, 그 집에서 얻은 단서로 다른 배달원을 찾아가요. 한 번 막혀도 확인할 방법을 찾는 **끈기**가 보여요. 조사에서 신중했던 그도 미나가 더는 조사에 관여하지 않아도 된다고 여겼어요."},{"title":"표는 같이 봤는데 날짜는 혼자 정했을 때","body":"당신은 함께 갈 여행의 후보 세 곳을 골라 교통편과 숙박비를 같은 기준으로 비교해요. 요금이 바뀔 때마다 표를 고쳐 주니 상대방도 무엇을 선택할 수 있는지 **바로 알아요**. 상대방은 숙소에 연락해 표에 없던 취소 조건을 확인하고, 답이 늦는 곳에는 **다시 문의해요**. 당신은 덕분에 예약 뒤에 생길 부담까지 알게 돼요.\n\n그런데 상대방은 취소가 가능한 숙소를 찾자 당신이 정리한 후보 가운데 하나를 **바로 예약해요**. “준비는 네가 다 했으니까 예약은 내가 했어”라고 해요. 상대방은 수고를 덜어 줬다고 생각하지만, 당신에게 표는 같이 결정하기 위한 자료였어요. 당신은 날짜를 고를 기회를 잃어서 서운해요.\n\n같이 항공권을 찾았어도 예매하려면 출발일과 비용에 동의했는지 따로 **확인해야 해요**. 환불이 어렵다면 두 사람의 답을 들은 뒤 결제하세요."},{"title":"취소 기한을 확인하고 둘이 날짜를 고르기","body":"당신은 “후보에 넣은 날들은 비교해 보자는 뜻이었어. 토요일에 갈 수 있을지는 아직 모르겠어”라고 **말해 보세요**. 상대방은 무료 취소 시각과 변경 가능 여부를 확인해 바로 **알려 주세요**. 숙소 답이 늦으면 예약 화면의 조건부터 확인하고 다시 문의해요. 조건을 살피고 답이 나올 때까지 확인하는 힘을 이미 한 예약을 수습하는 데 쓸 수 있어요.\n\n예약을 유지할지 이야기를 끝내야 할 시각부터 달력에 적어요. 그 전에 가능한 날짜와 지금 가격을 표에 올려 두면 두 사람이 같은 조건을 보고 답할 수 있어요. 둘 다 날짜에 동의하면 예약을 유지하고, 아직 답하기 어려운 분이 있으면 예약한 분이 무료 취소 기한 안에 취소해요. 꼼꼼하게 마련한 표는 다음에도 쓸 수 있어요. 날짜를 잠시 잡아 둘 수 있었다는 사실만으로 그날을 함께 보내기로 한 것은 아니니까요."}]},{"code":"T30","key":"기임","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-03/기임.md","sha":"188264689505cef6d3e05b5cd2eccc3c17de5e63","title":"이삿짐을 싸기 전에 필요한 도움을 물어요","work":"안나 카레니나","note":"기토 쪽은 ‘당신’, 임수 쪽은 ‘상대방’입니다. 성향은 원작 속 행동에서 읽었어요. 현대 장면과 대사는 가상이며 전체 명식 개인화는 적용하지 않았어요.","chapters":[{"title":"키티가 밝힌 뜻과 레빈이 돌아본 판단","body":"### 키티를 닮은 당신\n\n**적극성** · **세심함**\n\n레빈의 형이 위독하다는 소식에 키티는 함께 가겠다고 말해요. 레빈이 반대하자 어려운 때에 곁에 있고 싶다는 **뜻도 밝혀요**. 어떻게 돕고 싶은지 먼저 말하는 **적극성**이에요. 현장에서는 깨끗한 침구를 가져와요. 형이 옷을 갈아입으며 부끄러워하는 것도 알아차리고 자기는 보지 않는다고 안심시켜요. 몸에 필요한 것과 상대의 불편을 함께 살피는 **세심함**이에요. 위독한 가족을 돕는 상황이어서 평소 모든 일에 같은 방식으로 나선다고 보기는 어려워요.\n\n### 콘스탄틴 레빈을 닮은 상대방\n\n**탐구심** · **자기성찰**\n\n레빈은 삶을 어떻게 살아야 하는지 고민하던 중, 농부 표도르가 두 사람의 살아가는 방식을 다르게 설명하자 그 차이를 **더 물어요**. 눈앞의 말에서 이해가 안 되는 부분을 짚어 이유를 알아보는 **탐구심**이에요. 이어 그 말에 자신이 어떻게 반응했는지 돌아보고, 평소 자신은 무엇을 옳다고 여기며 살아왔는지 생각해요. 자기 삶을 다시 살피는 **자기성찰**이에요. 그는 형을 찾아갈 때에는 키티에게 이유를 묻기보다 혼자 있기 싫어서 따라온다고 짐작했어요. 평소 질문을 많이 하는 사람도 가까운 사람의 뜻을 안다고 생각하면 묻는 일을 건너뛸 **수 있어요**."},{"title":"같이 짐을 싸자는 말을 구경 가겠다는 뜻으로 들을 때","body":"상대방 가족이 이사를 앞뒀어요. 당신은 먼저 짐을 같이 싸겠다고 하고, 이사 당일 바로 꺼내야 할 물건은 따로 싸 두자고 해요. 상대방은 필요한 걸 먼저 챙겨 준다는 점이 고마워요. 평소 상대방이 모르는 게 있으면 가족에게 직접 물어보는 **점도 당신에게는 든든해요**.\n\n이번엔 상대방이 “와 **봐야 지루할걸**. 구경할 것도 없어”라고 해요. 당신은 힘든 일을 나누고 싶었는데 놀러 가겠다는 뜻으로 들렸다는 게 서운해요. 상대방은 힘든 일을 맡기고 싶지 않았지만, 왜 오려는지 묻지 않아 당신이 할 수 있는 일도 듣지 못했어요.\n\n이사하는 날에 함께할 수 있다는 말은 포장을 돕겠다는 뜻일 수도 있어요. 필요한 일과 시간을 정해 놓고 어떤 일을 맡을 **수 있는지 물어보세요**."},{"title":"왜 돕고 싶은지 듣고 가족에게 필요한 일을 묻기","body":"상대방은 “아까 너한테 지루할 거라고 한 말이 마음에 걸려. 네가 왜 도우려는지도 안 물어봤네. 어떤 일을 같이 하고 싶었어?”라고 **말해 보세요**. 자기 말을 돌아보는 건 거기서 시작할 수 있어요. 그다음에는 이유를 짐작하지 말고 **답을 들어 보세요**.\n\n“토요일에 두 시간 정도 주방 물건을 포장해 **줄 수 있어**. 직접 챙기고 싶은 물건이 있으면 빼 둘게.” 이렇게 제안하면 손을 보태면서도 주인이 결정할 몫이 남아요. 상대방은 이사 전날까지 가족에게 도움받고 **싶은지 물어봐요**. 가족이 원하면 시작 시간과 맡길 상자를 정하고, 가족끼리 하겠다고 답하면 그날은 각자 일정을 보내요."}]},{"code":"T06","key":"무경","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-03/무경.md","sha":"314ddeae718f66a2b822250b213cd32b5f17197a","title":"수강료를 보탠 뒤 상대의 진로가 달라졌어요","work":"삼국사기 온달전","note":"무토 쪽은 ‘당신’, 경금 쪽은 ‘상대방’입니다. 성향은 원작 속 행동에서 읽었어요. 현대 장면과 대사는 가상이며 전체 명식 개인화는 적용하지 않았어요.","chapters":[{"title":"공주가 마련한 살림과 온달이 나선 사냥","body":"### 평강공주를 닮은 당신\n\n**현실 감각** · **결단력**\n\n공주는 온달과 함께 살면서 팔찌를 팔아 집과 밭, 살림에 필요한 **물건을 마련해요**. 함께 살려면 무엇이 필요한지 알고 가진 재산을 쓰는 **현실 감각**이에요. **공주는 온달 모자를 다시 찾아가요.** 온달의 어머니가 가난을 이유로 난색을 보이자 공주는 뜻이 맞으면 함께 살 수 있다고 답해요. 자기가 정한 일을 실행에 옮기는 **결단력**을 읽을 수 있어요. 살림을 마련하는 데는 공주가 갖고 나온 재산도 중요한 조건이었어요.\n\n### 온달을 닮은 상대방\n\n**추진력** · **대담함**\n\n온달은 공주의 제안대로 쇠약해 내놓은 국마를 **골라 사 와요**. 공주가 기른 말을 타고 사냥에 나서 **많은 짐승을 잡아요**. 준비된 조건을 실제 행동으로 옮기는 **추진력**을 읽을 수 있어요. 여러 사람이 참가한 사냥에서 앞서 말을 모는 모습에는 **대담함**도 보여요. 말을 고르는 기준은 공주가 제시했어요. 열전은 온달이 그 기준을 어떻게 받아들였는지까지 전해 주지는 않아요."},{"title":"강좌를 시작한 뒤 다른 분야가 더 좋아졌을 때","body":"상대방이 새 기술을 배우고 **싶다고 해요**. 당신은 퇴근 뒤 다닐 수 있는 강좌와 수강료를 알아보고, 감당할 수 있는 만큼 이번 수강료를 보태기로 해요. 상대방은 덕분에 망설이던 공부를 시작하고 첫 주부터 시간을 내 수업과 실습을 해요. 당신도 상대방이 생소한 기술을 직접 해 보는 모습이 좋아요.\n\n그런데 기초 실습을 마친 상대방이 처음 생각한 취업 분야보다 다른 분야에 도전하고 **싶다고 해요**. 당신은 “그걸 하라고 돈을 보탠 게 아닌데”라고 답해요. 당신은 비용이 더 들까 봐 걱정되고, 상대방은 수강료를 도움받은 뒤로 진로를 바꾸는 말도 하기 어렵게 느껴요.\n\n수강료를 보탠 사람은 돈이 아깝다고 느낄 수 있고, 수업을 듣는 사람은 진로를 바꾸고 싶을 **수 있어요**. 남은 수업을 계속 들을지와 지원한 돈을 어떻게 할지는 따로 의논할 수 있어요."},{"title":"지원 한도를 정하고 새 분야는 작게 시험하기","body":"당신은 “내가 보탤 수 있는 건 이번 수강료까지야. 추가 비용이 드는지는 같이 확인하자”라고 **말해 보세요**. 돈을 냈을 때 두 사람이 어떤 목표에 실제로 합의했는지도 확인하세요. 감당할 비용을 따져 보고 지원 범위를 분명히 정하면, 당신은 현실적으로 도울 수 있는 선에서 결정을 내릴 수 있어요.\n\n상대방은 이번 주 안에 수업을 바꿀 수 있는지 **먼저 물어봐요**. 새 분야의 실습 과제 하나를 무료로 해 보고 다음 주말에 무엇이 더 맞았는지, 다시 수강하려면 얼마가 필요한지 얘기해요. 당신이 추가 비용을 내기 어렵다면 그 뜻도 **지금 말해 주세요**. 상대방은 이미 배운 것을 이어 갈지 자기 예산으로 다른 공부를 시작할지 고를 수 있어요. 처음 건넨 도움이 진로까지 정해 줘야 하는 것은 아니니까요."}]},{"code":"T19","key":"무계","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-03/무계.md","sha":"84432808516dbc747bb6ee14c034780c8bf3f204","title":"이사를 도운 뒤에는 방문할 날을 따로 정해요","work":"오만과 편견","note":"무토 쪽은 ‘당신’, 계수 쪽은 ‘상대방’입니다. 성향은 원작 속 행동에서 읽었어요. 현대 장면과 대사는 가상이며 전체 명식 개인화는 적용하지 않았어요.","chapters":[{"title":"다아시가 수습한 일과 엘리자베스가 다시 읽은 편지","body":"### 다아시를 닮은 당신\n\n**책임감** · **추진력**\n\n가디너 부인의 편지에 따르면 다아시는 위컴의 행실을 알고도 알리지 않은 일이 리디아 사건에 영향을 줬다고 **여겨 수습을 맡아요**. 자기 행동이 상황에 미친 영향을 돌아보고 수고를 감당하는 **책임감**으로 해석할 수 있어요. 그는 런던에서 두 사람을 찾아 위컴과 혼인 조건을 협의하고 필요한 **돈도 부담해요**. 해야 할 일을 찾아 실행하는 **추진력**이 보여요. 수습에는 다아시의 돈과 인맥이 쓰였고, 사건에 대한 설명은 가디너 부인이 전한 것이에요.\n\n### 엘리자베스를 닮은 상대방\n\n**신중함** · **자기성찰**\n\n엘리자베스는 위컴에 관한 다아시의 설명을 처음엔 **믿지 않아요**. 그러나 편지를 펼쳐 다시 읽고, 위컴이 전에 한 말과 자신이 **아는 일을 대조해요**. 확신이 흔들릴 때 근거를 다시 보는 **신중함**이에요. 그 과정에서 위컴의 호의에 기뻐하고 다아시에게 무시당했다고 느낀 일이 자기 판단에 영향을 줬음을 알아차려요. 자기 감정이 판단에 미친 몫을 돌아보는 **자기성찰**이 보여요. 편지를 읽는 일은 그때까지의 판단을 다시 살피는 계기였어요."},{"title":"자주 찾아오겠다는 말에 답을 미룰 때","body":"상대방이 이사하는 날 당신은 맡은 운반을 끝내고, 정리가 늦어지자 필요한 물건부터 꺼낼 수 **있게 도와줘요**. 상대방은 말한 일을 끝까지 해 주고 급한 일에도 바로 **움직이는 당신이 든든해요**. 당신도 상대방이 새집에서 혼자 쉴 시간과 만날 시간을 따져 보고, 처음 예상과 다르면 자기 일정을 고쳐 잡는 점을 좋아해요.\n\n이사가 끝나자 당신은 “이제 가까우니까 평일에도 자주 들러도 되지?”라고 물어요. 상대방은 평일에 쉬고 싶지만 거절하면 도움을 고마워하지 않는 것 같아 “좀 보고”라고 답해요. 당신은 이삿짐 정리만 끝나면 된다는 뜻으로 듣고 다음 날 저녁에 **가겠다고 해요**. 상대방은 생각할 시간도 없이 약속이 잡히는 것 같아 부담스러워요.\n\n이사를 도왔다는 이유로 다음 주에도 찾아와도 된다고 생각하기 쉬워요. 이사 뒤 혼자 쉴 시간이 필요하다면 방문을 거절하기 어려워지기 전에 가능한 날을 **알려 주세요**."},{"title":"내일 방문부터 다시 확인하기","body":"상대방은 “이사 도와준 **건 고마워**. 내일은 혼자 쉬고 싶어. 어제는 네가 서운해할까 봐 정확히 답을 못 했어”라고 **말해 보세요**. 쉬고 싶은 시간을 확인하고, 감사한 마음 때문에 답을 미뤘다는 점까지 돌아보면 지금 원하는 만남을 정확하게 말할 수 있어요.\n\n“네가 된다고 한 적도 없는데 내가 내일 간다고 했네. 내일은 쉬어.” 당신이 먼저 계획을 거두면 상대방은 새집에서 쉬고 싶다는 말을 한 번 더 방어하지 않아도 돼요. 토요일에 만나고 싶다면 그때 직접 물어보고, 답이 올 때까지 약속으로 잡아 두지 않아요. 이삿날에 짐을 함께 들었던 손길과 새집 문을 열어 주는 결정은 각자 따로 기억해도 좋아요."}]},{"code":"T32","key":"무임","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-04/무임.md","sha":"00e8ac11a1948ac023f4ebe79f0f3229017960ae","title":"오랜만에 만나는 주말, 각자의 일정부터 말해요","work":"오디세이아","note":"무토 쪽은 ‘당신’, 임수 쪽은 ‘상대방’이에요. 성향은 원작 행동에 대한 해석이며 현대 장면과 대사는 가상이에요. 전체 명식 개인화는 적용하지 않았어요.","chapters":[{"title":"페넬로페와 오디세우스가 서로를 알아볼 때","body":"### 페넬로페를 닮은 당신\n\n**신중함** · **끈기**\n\n페넬로페는 남편이 돌아왔다는 말을 듣고도 바로 **믿지 않아요**. 오디세우스가 지은 침실에서 침대를 밖으로 옮기라고 하며 그의 반응을 살펴요. 오랜 부재 끝에 돌아온 사람이 누구인지 확인하려는 **신중함**이에요. 또 구혼자들에게는 시아버지의 수의를 다 짤 때까지 재혼을 재촉하지 말라고 하고, 낮에 짠 천을 밤마다 풀어 결정을 미뤄요. 압박 속에서도 시간을 벌 방법을 여러 해 이어 간 **끈기**로 읽을 수 있어요. 재혼을 압박받고 누군가에게 속을까 걱정하는 처지가 두 행동의 배경이에요.\n\n### 오디세우스를 닮은 상대방\n\n**경계심** · **꼼꼼함**\n\n오디세우스는 이타카에 닿은 뒤 아테나가 마련해 준 변장으로 **정체를 감춰요**. 집을 차지한 구혼자들 앞에서 자신을 쉽게 드러내지 않는 **경계심**을 읽을 수 있어요. 페넬로페가 침대를 옮기라고 하자 그는 뿌리 박힌 올리브나무의 줄기를 깎아 침대 기둥으로 삼은 과정을 설명해요. 침대를 만드는 데 들인 **꼼꼼함**이 구체적으로 드러나요. 그는 침대가 옮겨졌을지도 모른다는 말에 **화부터 내요**. 세부를 잘 기억해도 상대가 왜 그 말을 꺼냈는지는 바로 알아차리지 못해요."},{"title":"다시 만나는 주말에 각자 다른 계획이 있을 때","body":"떨어져 살던 두 분이 다시 가까운 곳에 **살게 됐어요**. 당신은 예전에 토요일마다 같이 저녁을 먹던 게 좋아서 그 시간을 다시 챙기고 싶어요. 상대방도 지난번에 당신 퇴근 시간에 맞춰 식당 시간을 확인해 뒀어요. 오랜만에 만나도 서로 좋아하는 일을 기억해 주니 반가웠어요.\n\n당신이 “이제 토요일 저녁은 매주 같이 먹자”라고 하자 상대방은 “매주는 좀 어려워”라고만 해요. 떨어져 사는 동안 토요일 저녁마다 나가던 모임이 생겼지만, 말하면 당신이 서운해할까 봐 어디까지 약속할 수 있는지 설명하지 않았어요. 당신은 예전만큼 만나고 싶지 않다는 뜻으로 듣고, 상대방은 어렵게 자리 잡은 생활을 접어야 할 **것 같아요**.\n\n오랜만에 가까이 살게 됐다고 주말 전체를 비워 두었을 거라 생각하기 쉬워요. 이미 잡힌 약속을 말한 뒤 같이 보낼 시간을 정하면 각자 기대했던 일을 놓치지 않아요."},{"title":"이어 가고 싶은 약속과 새 일정을 같이 말해요","body":"당신은 “토요일 저녁이 그리웠어. 아까는 더 만나기 싫다는 말처럼 들렸는데, 요즘 주말은 **어떻게 보내?”라고 물어보세요**. 상대방은 “나도 같이 먹고 싶어. 토요일 저녁엔 모임이 있어. 이번 주 일요일 점심은 어때?”라고 답할 수 있어요. 상대가 어떤 시간을 꾸준히 지키고 싶은지 알면 예전 약속에서 무엇을 이어 갈지도 의논할 수 있어요.\n\n이번 주가 어렵다면 수요일까지 다음 주말에 비는 시간을 하나씩 보내요. 겹치는 시간이 있으면 식사 한 번을 정하고, 없으면 예정대로 **각자 지내요**. 한두 번 만나 본 뒤 어느 간격이 편한지 다시 묻기로 해요. 오래전 토요일의 저녁을 기억해 준 건 반갑지만, 지금 상대가 어느 토요일에 지치는지는 직접 물어야 알 수 있어요."}]},{"code":"T08","key":"병경","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-04/병경.md","sha":"eeb0e0f5fa80257566ac618322306b8eb2bf0102","title":"모임에서 말이 끊겼을 때 어떻게 도와줄까요?","work":"헛소동","note":"병화 쪽은 ‘당신’, 경금 쪽은 ‘상대방’이에요. 성향은 원작 행동에 대한 해석이며 현대 장면과 대사는 가상이에요. 전체 명식 개인화는 적용하지 않았어요.","chapters":[{"title":"베아트리스가 항의하고 베네딕이 친구에게 맞설 때","body":"### 베아트리스를 닮은 당신\n\n**솔직함** · **정의감**\n\n클라우디오가 결혼식에서 헤로를 **공개적으로 모욕해요**. 베아트리스는 친족인 헤로가 당한 일을 두고 베네딕 앞에서 분노를 숨기지 않아요. 불편한 감정도 분명히 드러내는 **솔직함**, 부당한 일을 그냥 넘기지 않으려는 **정의감**이 보여요. 다만 그 분노로 베네딕에게 클라우디오를 죽이라고 요구해요. 부당함을 알아보는 태도와 상대에게 폭력을 요구하는 행동은 구분해서 볼 필요가 있어요.\n\n### 베네딕을 닮은 상대방\n\n**원칙성** · **결단력**\n\n베네딕은 처음에는 베아트리스의 요구를 거절해요. 헤로가 부당한 일을 당했다고 진심으로 생각하느냐고 묻고, 베아트리스의 답을 들은 뒤 클라우디오에게 맞서기로 해요. 친한 사람의 행동도 따로 판단하려는 **원칙성**으로 해석할 수 있어요. 이후 클라우디오를 직접 찾아가 헤로에게 한 일을 비난하고 **결투를 청해요**. 결심을 행동으로 옮기는 **결단력**이 드러나지만, 그 행동에는 작품 속 명예와 결투 관습이 얽혀 있어요."},{"title":"집에서는 내 편인데 모임에서는 웃어넘길 때","body":"친구들 모임에서 한 사람이 자꾸 당신의 **말을 끊어요**. 당신은 집에 와서 “내가 다시 말하려는데 또 끊겨서 속상했어”라고 해요. 상대방은 먼저 불편한 일을 말해 줘서 고맙다고 하고, 친한 친구라도 말을 계속 끊는 **건 무례하다고 답해요**. 당신은 상대방이 친분에 상관없이 그 일을 봐 준 게 든든해요.\n\n다음 모임에서도 같은 **일이 생겨요**. 상대방은 분위기를 깨고 싶지 않아 따라 웃고, 당신은 하던 **말을 접어요**. 상대방은 공개적으로 친구를 꾸짖어 달라는 건지 몰라 망설였어요. 당신이 바란 건 그 자리에서 자기 말을 끝낼 기회였어요.\n\n모임에서 상대의 말이 끊겼다면 “아까 하던 얘기 마저 듣고 싶어”라고 할 수 있어요. 어떤 도움이 반가운지는 모임이 끝난 **뒤 따로 물어보세요**."},{"title":"끊긴 말을 다시 할 수 있게 도와요","body":"다음 모임 전에 “또 내 말이 끊기면 ‘아까 하던 얘기 마저 들어 보자’고 해 줄래?”라고 **말해 보세요**. 상대방은 “지난번에 나도 웃어서 네 말이 그냥 넘어갔어. 다음엔 말할 차례를 돌려줄게”라고 답할 **수 있어요**. 대신 말해 주는 게 부담스럽다면 당신이 “잠깐만, 나 아직 말 안 끝났어”라고 할 때 상대방은 새 화제로 넘어가지 않고 기다려 줄 수 있어요.\n\n모임 뒤에 “아까 내가 네 말을 이어 주려고 했을 때 어땠어?”라고 물어봐요. 그 순간 목소리를 보태 주는 게 반가울 수도 있고, 본인이 말할 차례를 조금 더 기다려 주었으면 할 **수도 있어요**. 같은 일이 반복되면 당신은 친구에게 따로 말하거나 다음 모임을 쉴 수 있어요. 상대방이 대신 연락하고 싶다면 누구에게 어떤 말을 할지 당신과 먼저 의논해요."}]},{"code":"T21","key":"병병","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-04/병병.md","sha":"57de6aa0f97feb1dc92bd0e66fd6f7a515e24c5e","title":"즐거웠던 주말 뒤, 다음 약속은 같이 정해요","work":"로미오와 줄리엣","note":"두 분 모두 두 인물의 관점을 함께 읽어요. 개인별 배역은 정하지 않아요. 성향은 원작 행동에 대한 해석이며 현대 장면과 대사는 가상이에요. 전체 명식 개인화는 적용하지 않았어요.","chapters":[{"title":"마음을 드러내고 약속을 의논하는 두 사람","body":"### 로미오의 관점\n\n**적극성** · **솔직함**\n\n로미오는 캐퓰릿 집안의 정원에 들어가고, 줄리엣의 말을 듣다가 자신이 거기 **있다는 걸 드러내요**. 만나고 싶은 마음을 행동으로 옮기는 **적극성**이에요. 줄리엣이 사랑을 묻자 마음을 감추지 않고 맹세하려는 모습에서는 **솔직함**을 읽을 수 있어요. **다만 줄리엣이 그날의 약속을 성급하다고 하는데도 로미오는 그날 밤 서로 맹세하길 바라요.** 로미오에게는 지금 떠나기 전에 마음을 확인하는 일이에요. 줄리엣에게는 오늘 들은 말을 오늘 안에 약속으로 받아들일지 정해야 하는 일이죠.\n\n### 줄리엣의 관점\n\n**대담함** · **신중함**\n\n줄리엣은 로미오가 자기 말을 엿들은 걸 알고도 마음을 부정하지 않고, 그에게 **사랑하는지 직접 물어요**. 상대의 답을 듣기 전에 자기 마음도 드러내는 **대담함**이에요. 동시에 그날 밤 맹세가 너무 성급하다고 말하고, 혼인할 뜻이라면 이튿날 사람을 통해 소식을 **전해 달라고 해요**. 마음을 표현하면서도 약속의 방법을 따져 보는 **신중함**이에요. 줄리엣이 청한 시간은 고작 하룻밤이에요. 그 짧은 틈에 무엇을 확인하고 싶은지 분명히 말한다는 점에서 로미오의 맹세와 결이 달라요."},{"title":"여행 얘기에 대답이 늦어질 때","body":"함께 보낸 **주말이 즐거웠어요**. 한 분이 “오늘 **진짜 좋았어**. 다음 달엔 매주 보고 여름엔 여행도 가자”라고 해요. 듣는 분도 헤어지기 아쉬웠어요. 다음 주에 또 보자는 데는 금방 고개를 끄덕일 수 있을 것 같았죠. 그런데 여행까지 한꺼번에 나오자 잠깐 달력을 보고 싶어져요.\n\n“달력 좀 보고 정하자.” 그 말을 들은 분에게는 여행 날짜보다 먼저, 오늘이 좋았다는 말이 상대에게 닿았는지가 궁금해요. 답을 미룬 분은 여행도 가 보고 싶지만 다음 달 주말마다 만나면 혼자 쉴 시간이 **없을까 걱정돼요**. 그 걱정을 꺼내면 오늘이 별로였다는 말로 들릴까 **봐 망설여요**.\n\n지난 주말이 즐거웠다는 말만으로 다음 달 여행 일정까지 확정되지는 않아요. 같이 가고 싶은지 먼저 묻고 날짜는 각자 일정을 확인한 **뒤 정하세요**."},{"title":"다음 주 토요일부터 정해 볼까요?","body":"“나도 오늘 좋았어. 다음 주에는 또 보고 싶어. **그다음 주는 쉬고 싶고”라고 말해 보세요.** 제안한 분도 “나는 여행 얘기까지 한꺼번에 꺼냈네. 다음 주 토요일부터 정할까?”라고 물어볼 **수 있어요**. 먼저 만남 하나를 정하고, 다음에 얘기할 날까지 각자 쉬고 싶은 주말을 살펴보세요.\n\n여행은 날짜가 맞는지 이번 주말에 달력을 보며 **따로 의논해요**. 둘 다 갈 수 있다고 답하기 전에는 숙소를 예약하지 않아요. 날짜가 안 맞으면 그 자리에서 빈 주말을 억지로 찾기보다, 다음에 함께 쉬고 싶은 **날이 있는지 물어보세요**. 여행을 의논하는 동안에도 다음 만남은 두 사람이 이미 정해 둔 약속으로 남아요."}]},{"code":"T34","key":"병신","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-04/병신.md","sha":"67035db007fbdabf580fe89309174ad3f55c2881","title":"함께 살 집을 고를 때 출근과 돌봄 시간도 따져요","work":"에마","note":"병화 쪽은 ‘당신’, 신금 쪽은 ‘상대방’이에요. 성향은 원작 행동에 대한 해석이며 현대 장면과 대사는 가상이에요. 전체 명식 개인화는 적용하지 않았어요.","chapters":[{"title":"에마의 걱정을 듣고 나이틀리가 거처를 다시 생각할 때","body":"### 에마를 닮은 당신\n\n**애정 깊음** · **신중함**\n\n에마는 나이틀리와 결혼하고 싶어도 아버지를 두고 떠날 **수는 없다고 말해요**. 앞으로 함께할 사람을 생각하면서 지금 곁에 있는 사람도 돌보려는 **애정 깊음**이 드러나요. 나이틀리가 하트필드로 들어오겠다고 하자 그가 자기 집에서 누리던 자유를 얼마나 포기해야 할지 생각하고, 시간을 두고 한 번 더 **생각해 보라고 해요**. 반가운 제안도 상대에게 어떤 변화인지 살피는 **신중함**이에요. 아버지와 함께 살겠다는 전제에서 오간 논의라 선택지가 넓었던 것은 아니에요.\n\n### 나이틀리를 닮은 상대방\n\n**세심함** · **유연함**\n\n나이틀리는 처음엔 에마와 아버지가 자기 집인 돈웰로 오는 방안을 생각해요. 그러다 익숙한 집을 떠나는 일이 아버지에게 얼마나 힘들지 헤아려 그 **방안을 접어요**. 이사하는 사람에게 어떤 변화가 생기는지 살피는 **세심함**이에요. 아버지가 하트필드에 살아야 하는 동안 자신도 그곳에서 지내겠다고 제안하는 데서 **유연함**이 보여요. 두 집을 오갈 수 있는 인물의 형편은 오늘날 이사와 돌봄의 조건과 달라요."},{"title":"배려해서 고른 집인데 둘 다 망설일 때","body":"같이 살 집을 찾는 두 분에게 조건이 하나씩 있어요. 당신은 수요일 퇴근 뒤 가족 집에 들러 저녁을 챙기고, 상대방은 목요일 아침 일찍 출근해요. 상대방은 당신이 가족 집에 가기 편하라고 그 근처 매물을 찾아요. 당신은 돌봄 일정을 기억해 준 **게 고마워요**. 상대방도 당신이 매물을 보고 자기 출근길부터 물어봐 준 **게 반가워요**.\n\n그런데 당신이 “여기서 출근하면 너무 멀지 않아?”라고 묻자 상대방은 또 처음부터 집을 찾아야 하는 **줄 알고 답답해요**. “그냥 내가 좀 일찍 나가면 돼”라는 답을 들은 당신은 매주 새벽에 일어날 부담을 자기 때문에 떠안는 것 같아 마음이 무거워요. 두 사람 모두 상대를 배려하고 있지만 실제로 얼마나 더 걸리는지는 아직 확인하지 않았어요.\n\n집값이 예산에 맞아도 출근이나 가족을 돌보는 데 드는 시간이 늘 **수 있어요**. 집마다 평일에 각자가 움직일 경로를 한 번씩 그려 보세요."},{"title":"이사한 뒤의 수요일 저녁과 목요일 아침을 확인해요","body":"당신은 “수요일 저녁에 가족 집에 제때 갈 수 있으면 꼭 그 동네일 필요는 없어”라고 **말해 보세요**. 상대방도 “목요일에 몇 시에 집을 나서야 하는지 알고 정하고 **싶어”라고 말해 보세요**. 이번 주에 당신은 후보 주소에서 가족 집까지 퇴근 시간에 얼마나 걸리는지, 상대방은 목요일 아침 첫 교통편과 출근 시간을 확인해요.\n\n주말에 지도와 출근 시간을 펴 놓고 두 사람의 일정을 모두 지킬 수 있는 후보만 남겨요. 가족 집과 가까운 매물이어도 목요일마다 한 사람이 훨씬 일찍 나서야 한다면, 그 부담을 서로 듣고 **지역을 다시 찾아봐요**. 맞는 집이 당장 없으면 계약은 미루고 지금 집에서 만나기 편한 날을 잡아요. 수요일 저녁과 목요일 아침을 달력에 나란히 적어 놓으면 그동안 어느 쪽 시간을 더 쉽게 양보해 왔는지도 보여요."}]},{"code":"T10","key":"병임","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-05/병임.md","sha":"1e7f0a4b0ae5538329e6e54e728fb4926baea61a","title":"약속이 취소된 이유를 직접 물어요","work":"스칼렛 핌퍼넬","note":"병화 쪽은 ‘당신’, 임수 쪽은 ‘상대방’이에요. 성향은 원작 행동에 대한 해석이며 현대 장면과 대사는 가상이에요. 전체 명식 개인화는 적용하지 않았어요.","chapters":[{"title":"말을 잘하는 마르그리트도 남편에게는 설명을 미뤄요","body":"### 마르그리트 블레이크니를 닮은 당신\n\n**사교성** · **자존심**\n\n마르그리트는 무도회에서 왕세자와 재치 있는 말을 주고받으며 사람들과 어울려요. 여러 사람 앞에서도 대화를 이어 가는 **사교성**이 보여요. 하지만 남편과의 대화에서는 과거 일을 설명하지 않았던 이유가 자존심 때문이었다고 말해요. 자신을 사랑한다면 설명 없이도 믿어 주길 바랐던 **자존심**이에요. 사람들과 말을 잘하는 것과 가까운 사람에게 부끄럽거나 억울한 사정을 설명하는 것은 **다른 일이에요**.\n\n### 퍼시 블레이크니를 닮은 상대방\n\n**유연함** · **경계심**\n\n퍼시는 구조 활동 중 변장하고, 추격자의 명령을 들은 뒤 그 허점을 이용해 피신 방법을 마련해요. 상황이 바뀌면 방법도 바꾸는 **유연함**이 보여요. 반면 아내가 다가와도 다시 상처받을 수 있다고 생각하며 냉담한 태도를 거두지 않아요. 가까운 사람의 말도 선뜻 믿지 못하는 **경계심**으로 해석할 수 있어요. 구조 활동을 숨기는 이유와 아내를 불신하는 이유는 구별해야 해요. 재회 때 퍼시도 아내를 더 믿었어야 했다고 말해요."},{"title":"친구들과는 잘 지내는데 내 약속만 취소할 때","body":"당신은 모임에서 처음 만난 사람도 대화에 **끼워 줘요**. 상대방은 당신 덕분에 낯선 자리에서도 편해요. 상대방은 일정이 바뀌면 다른 장소나 시간을 잘 찾아 줘서 함께하는 약속이 쉽게 깨지지 않아요.\n\n이번에는 상대방이 토요일 약속을 “이번 주는 어려워”라는 **말로 취소해요**. 전날 친구들과 웃으며 지냈다는 이야기를 들은 당신은 자기만 피하는 **것 같아요**. 서운하다고 먼저 말하면 매달리는 것 같아 “그럼 됐어”라고 답해요. 상대방은 가족 일로 시간을 내기 어렵지만, 자세히 묻지 않는 당신에게 먼저 말하기를 망설여요. 짧아진 답을 보고 화가 났다고 생각하니 설명하기가 더 어려워져요. 당신은 설명이 없어서 멀어지고, 상대방은 당신이 멀어진 것 같아서 말을 아껴요.\n\n약속 취소가 반복되면 서운하다는 말과 함께 다음에 언제 만날 **수 있는지 물어보세요**. 상대가 바쁜 사정과 내가 비워 둔 시간을 한꺼번에 이야기할 **수 있어요**."},{"title":"서운했던 행동을 말하고 다음 연락을 정해요","body":"당신은 “친구들은 만났는데 우리 약속은 취소하니까 나를 피하는 줄 알았어. 무슨 사정인지 말해 줄 수 **있어?”라고 물어보세요**. 상대방은 “가족 일로 토요일에 시간을 내기 어려워. 자세한 얘기는 아직 하기 힘들어”처럼 지금 설명할 수 있는 **데까지 말해요**. 다른 날 만날 수 있다면 날짜를 제안하고, 아직 모르면 일요일 저녁까지 다시 연락하기로 정해요.\n\n“나를 피한다고 생각한 건 **내 짐작이었어**. 그래도 다음에 못 만나는 날에는 다른 날을 잡을 수 있는지 알려 줬으면 해.” 그렇게 말하면 그날 사정과 앞으로 바라는 일을 따로 얘기할 수 있어요. 일요일도 아직 확실하지 않다면 이번 주말은 각자 쓰고, 언제 일정을 다시 볼지 알려 주세요. 취소가 반복될 때는 다음 약속을 일단 잡기보다 그 주에 낼 수 있는 시간이 얼마나 되는지부터 물어봐요."}]},{"code":"T23","key":"신계","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-05/신계.md","sha":"a69868e48af384a94e5ee8aefb655978e4381ab3","title":"다른 약속이 있다면 연인에게도 미리 알려요","work":"이성과 감성","note":"신금 쪽은 ‘당신’, 계수 쪽은 ‘상대방’이에요. 성향은 원작 행동에 대한 해석이며 현대 장면과 대사는 가상이에요. 전체 명식 개인화는 적용하지 않았어요.","chapters":[{"title":"에드워드는 약혼을 지키고 엘리너는 들은 말을 살펴요","body":"### 에드워드를 닮은 당신\n\n**책임감** · **고집스러움**\n\n에드워드는 어머니에게 버림받은 뒤에도 루시에게 약혼을 계속할지 선택하게 **했다고 말해요**. 자기 형편이 어려워졌다고 약속을 일방적으로 없애지 않으려는 **책임감**이 보여요. 하지만 이미 사랑하지 않는 사람과의 약혼을 오래 유지하는 데서는 **고집스러움**도 읽을 수 있어요. 루시가 여전히 자신을 사랑한다고 믿었던 사정이 있으므로 단순히 고집만으로 버텼다고 **단정할 수는 없어요**. 엘리너에게 기대를 품게 한 행동의 잘못도 별도로 남아요.\n\n### 엘리너를 닮은 상대방\n\n**신중함** · **절제력**\n\n엘리너는 루시에게 약혼 이야기를 듣고 편지와 초상화, 에드워드의 방문과 태도를 **함께 생각해요**. 듣고 싶지 않은 말도 근거를 살펴 판단하는 **신중함**이에요. 크게 상심했어도 가족에게 그 비밀이 드러나지 않도록 행동하는 **절제력**이 있어요. 겉으로 평온해 보인다고 상처가 **없었던 것은 아니에요**. 이 장면의 인내를 연인이 계속 기다려야 할 의무로 옮기지는 않아요."},{"title":"맡은 일을 지키려다 연인의 시간을 비워 둘 때","body":"당신은 먼저 한 약속을 **쉽게 취소하지 않아요**. 상대방은 당신이 맡은 일을 끝까지 하는 **점을 믿어요**. 상대방도 사정을 다 듣기 전에 몰아세우지 않고, 속상해도 차분하게 물어봐 줘요. 당신은 그 덕분에 어려운 이야기도 꺼낼 수 있어요.\n\n그런데 다른 사람을 돕기로 한 일 때문에 토요일 만남이 **두 번 바뀌어요**. 당신은 그 사람의 사정을 지켜 주려 “지금은 설명하기 어려워”라고만 해요. 상대방은 캐묻는 것처럼 보일까 더 묻지 않고 다음 토요일도 비워 둬요. 당신은 이 약속만큼은 지켜야 한다고 생각하지만, 상대방은 언제까지 기다려야 하는지 몰라 답답해요. 두 사람 모두 말을 아낀 탓에 상대방의 토요일까지 이미 정해진 셈이 됐어요.\n\n다른 약속을 지키려면 연인과 만나기 **어려운 날도 생겨요**. 이번 주 일정을 먼저 알려 주면 상대도 기다리는 대신 자기 계획을 잡을 수 있어요."},{"title":"말할 수 있는 일정부터 오늘 알려 줘요","body":"당신은 “다른 사람의 사정은 말할 수 없지만 다음 두 주 토요일은 만나기 어려워. 일요일 오후는 가능해”라고 **알려 주세요**. 상대방도 “자세한 사정보다 내가 언제 다른 약속을 잡아도 되는지 알고 싶었어”라고 말해요. 상대방이 일요일에는 쉬고 싶다면 이번 두 주는 만나지 않는 선택도 가능해요.\n\n도움을 주기로 한 일이 아직 언제 끝날지 모르면 이번 토요일은 각자 쓰기로 해요. 그날 빈 시간이 생기면 상대방도 여전히 비어 있는지 **새로 물어보세요**. 다른 약속을 매주 맡는 일이 부담되기 시작했다면 도움을 받는 사람과도 다음 주에 얘기해요. “확정되기 전까지는 토요일을 비워 두기 어려워”라는 말을 들었다고 해서 둘 중 누구에게 한 약속을 버려야 하는 건 아니에요. 각자 쓸 시간을 제때 알리는 것부터 할 수 있어요."}]},{"code":"T36","key":"신임","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-05/신임.md","sha":"471186c36126e746df666f1a6d9a1116e853f386","title":"상대가 돈을 빌려주겠다고 할 때","work":"북과 남","note":"신금 쪽은 ‘당신’, 임수 쪽은 ‘상대방’이에요. 성향은 원작 행동에 대한 해석이며 현대 장면과 대사는 가상이에요. 전체 명식 개인화는 적용하지 않았어요.","chapters":[{"title":"손턴이 거절한 위험과 마거릿이 마련한 제안","body":"### 손턴을 닮은 당신\n\n**원칙성** · **자존심**\n\n손턴은 사업을 살릴 수 있는 투기 **제안을 거절해요**. 실패하면 채권자들의 돈까지 잃게 할 **수 있기 때문이에요**. 자신의 회복을 위해 다른 사람에게 위험을 떠넘기지 않으려는 **원칙성**이 보여요. 한편 밤늦게까지 장부를 보면서도 어머니에게 걱정을 먼저 털어놓지 않아요. 자기 어려움을 드러내기 힘들어하는 **자존심**으로 해석할 수 있어요. 뒤에는 어머니에게 형편을 설명하고 위로를 구하므로, 끝까지 도움을 거부하는 인물로 보지는 않아요.\n\n### 마거릿을 닮은 상대방\n\n**유연함** · **현실 감각**\n\n마거릿은 손턴이 공장 임차를 그만두려 하자 자신의 자금을 **활용할 방안을 제안해요**. 막힌 상황에서 다른 방법을 찾는 **유연함**이 보여요. 은행에 있는 돈과 현재 이자를 설명하고 담보에 관한 서류도 찾는 데서 **현실 감각**이 드러나요. 다만 이 대화는 두 사람의 애정이 확인되는 장면으로 이어져요. 이후의 계약 조건까지 모두 합의한 장면은 아니에요."},{"title":"믿어서 빌려주겠다는 말이 부담스러울 때","body":"당신은 함께 돈을 쓸 때도 돌려줄 수 있는 **금액인지 먼저 따져요**. 상대방은 무리한 약속을 하지 않는 당신을 믿어요. 상대방은 필요한 비용을 줄이거나 다른 방법을 찾아 **주는 데 능해요**. 당신은 혼자서는 막막했던 일을 구체적으로 의논할 수 있어 좋아요.\n\n이번에는 작업비가 부족한 당신에게 상대방이 돈을 **빌려주겠다고 해요**. 당신은 일이 실패하면 상대방까지 손해 볼 수 있어 망설여요. 형편을 자세히 말하기도 부끄러워 “내가 알아서 할게”라고 답해요. 상대방은 금액과 갚을 기간을 같이 정하면 될 줄 알았는데, 자기 도움 자체가 싫은 것 같아 서운해요. 당신은 돈을 빌리기 어렵다는 뜻이고 상대방은 자신을 믿지 않는다는 뜻으로 들어요.\n\n돈을 빌리는 게 부담스럽다면 갚을 수 있을지 걱정된다고 **말해도 좋아요**. 상대와 함께 지출을 줄일 방법을 알아보는 것도 도움을 받는 방법이에요."},{"title":"송금하기 전에 받을지부터 답해요","body":"당신은 “도와주려는 **마음은 고마워**. 못 갚게 될까 걱정돼서 지금은 빌리지 않고 작업 규모를 줄여 보고 싶어”라고 말할 **수 있어요**. 상대방은 서운했던 마음을 말하되, 돈을 받는 답이 나오기 전에는 송금하지 않아요. 대신 당신이 원한다면 이번 주말에 필요한 비용을 함께 검토해요. 당신은 수입과 비용을 정리해 어떤 도움이 필요한지 직접 알려 줘요.\n\n그래도 돈을 빌리는 쪽을 생각한다면 얼마를 언제 돌려줄지 적어 놓고, 늦어질 경우도 각자 감당할 수 있을지 다음 **주에 얘기해요**. 한 분이 마음을 바꾸면 이유를 계속 요구하지 않고 다른 방법을 살펴봐요. 제안을 거둔 날에도 “지난번에 같이 비용을 알아봐 준 건 고마웠어”라고 말할 수 있어요. 도움받고 싶은 마음은 돈을 빌리는 결정과 함께 묶어 둘 필요가 없어요."}]},{"code":"T12","key":"을기","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-05/을기.md","sha":"74c5ceda52311dbf5616c20f1862d973d04881d1","title":"휴가를 부탁하기 전에 날짜를 함께 정해요","work":"아그네스 그레이","note":"을목 쪽은 ‘당신’, 기토 쪽은 ‘상대방’이에요. 성향은 원작 행동에 대한 해석이며 현대 장면과 대사는 가상이에요. 전체 명식 개인화는 적용하지 않았어요.","chapters":[{"title":"아그네스가 걱정을 말하자 웨스턴이 준비한 답을 꺼내요","body":"### 아그네스 그레이를 닮은 당신\n\n**유연함** · **신중함**\n\n아그네스는 눈이 좋지 않은 낸시에게 책을 읽어 준 뒤, 아들에게 줄 셔츠를 만드는 **일도 도와요**. 그날 필요한 일에 맞춰 돕는 **유연함**이 보여요. 웨스턴의 청혼에는 어머니를 떠나는 문제와 어머니의 동의를 **먼저 말해요**. 기쁜 제안에도 지금 함께 사는 사람의 생활을 살피는 **신중함**이에요. 당시 혼인과 가족 동의의 조건은 오늘날 연인의 휴가 결정과 달라요.\n\n### 에드워드 웨스턴을 닮은 상대방\n\n**세심함** · **현실 감각**\n\n웨스턴은 사냥터지기가 쏘려던 낸시의 고양이를 구해 데려와요. 낸시에게 소중한 것이 무엇인지 살피는 **세심함**이 보여요. 청혼할 때는 어머니가 학교 보조교사를 고용하고 방학에 딸들을 방문할 계획이라고 전해요. 혼인 뒤 생활에 필요한 방안을 구체적으로 이야기하는 **현실 감각**이에요. 다만 이 계획은 어머니와 먼저 의논한 내용이에요. 아그네스는 이후 자기 동의를 밝히며, 어머니도 동거 제안을 거절해요. 준비한 사람이 모두의 선택을 대신한 장면으로 단순화하지 않아요."},{"title":"내 걱정을 기억해 준 것은 고맙지만 날짜까지 정해졌을 때","body":"당신은 가족을 도울 때도 그날 필요한 일을 물어보고 맡아요. 상대방은 당신과 함께하면 계획이 조금 바뀌어도 의논할 수 **있어 편해요**. 상대방은 당신이 걱정했던 일을 기억하고 필요한 정보를 **찾아 줘요**. 당신은 막연했던 계획을 실제로 준비할 수 있어 고마워요.\n\n상대방이 일주일 휴가를 제안하며 가족에게 돌봄을 부탁해 **두었다고 해요**. 당신이 가족을 돌보느라 오래 집을 비우기 어렵다고 했던 것을 기억한 거예요. 당신은 도움을 알아봐 준 건 반갑지만 이번에는 사흘만 쉬고 싶어요. 이미 다른 사람에게 날짜까지 부탁했다니 말을 바꾸기 어려워요. 상대방은 걱정을 덜어 주려고 구체적으로 준비했는데, 당신이 망설이니 수고가 소용없어진 것 같아요. 필요한 도움을 찾는 데 집중하다 두 사람이 원하는 휴가 길이를 먼저 묻지 않았어요.\n\n휴가를 갈 만한 곳을 미리 알아본 수고는 반가울 **수 있어요**. 그래도 직장에 휴가를 신청하거나 숙소를 예약하기 전에는 날짜가 두 사람에게 모두 되는지 **확인해야 해요**."},{"title":"부탁한 날짜를 다시 확인하고 휴가 길이부터 정해요","body":"당신은 “돌봄을 알아봐 **준 건 고마워**. 나는 이번에는 사흘만 쉬고 싶어. 날짜는 우리 둘이 먼저 정했으면 해”라고 말해요. 상대방은 가족에게 가능 여부만 물었는지, 확정해서 부탁했는지 알려 줘요. 날짜까지 부탁했다면 상대방이 오늘 연락해 아직 두 사람의 휴가는 정해지지 않았다고 설명하고 변경 가능 여부를 물어요.\n\n이번 주말에 당신은 가족에게 어느 날 도움을 원하는지 묻고, 상대방은 사흘 동안 갈 수 있는 곳과 비용을 알아봐요. 두 사람이 날짜를 고른 뒤 가족에게 그날도 괜찮은지 **확인하고 예약해요**. **맞는 날이 없다면 이번에는 날짜를 더 찾아봐요.** 다음에 좋은 숙소를 발견했을 때도 그 정보를 먼저 나누고, 다른 사람에게 시간을 비워 달라는 부탁은 두 사람의 대답이 모인 뒤에 해요."}]},{"code":"T25","key":"을신","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-06/을신.md","sha":"0e850d52633f24932d73277a8745601a563f2958","title":"이해했다는 말 뒤에 남은 결정","work":"오만과 편견","note":"을목 쪽은 ‘당신’, 신금 쪽은 ‘상대방’이에요. 성향은 원작 행동에 대한 해석이에요. 현대 장면과 대사는 가상이며 전체 명식 개인화는 적용하지 않았어요.","chapters":[{"title":"편지를 쓴 다아시와 다시 읽은 엘리자베스","body":"### 엘리자베스를 닮은 당신\n\n**유연함** · **신중함**\n\n엘리자베스는 다아시가 보낸 편지를 처음 읽을 때 그의 말을 **믿기 어려워해요**. 그래도 편지를 다시 펴고 위컴이 자기에게 했던 말과 그동안 본 **행동을 하나씩 떠올려요**. 근거를 다시 살피는 **신중함**과, 그 결과 위컴에 대한 자기 판단을 고치는 **유연함**이 보여요. 편지를 이해하기까지 여러 번 읽고 생각하는 시간이 필요했어요. 다아시와 결혼하기까지는 그 뒤로도 여러 사건과 대화가 이어져요.\n\n### 다아시를 닮은 상대방\n\n**꼼꼼함** · **뚜렷한 주관**\n\n다아시는 편지에서 빙리와 제인을 떼어 놓은 일과 위컴에 관한 **일을 차례로 설명해요**. 위컴에 관한 진술은 피츠윌리엄 대령에게 확인할 수 있다고도 **알려 줘요**. 쟁점과 확인할 사람을 짚는 **꼼꼼함**이에요. 비판을 받은 뒤에도 어떤 판단으로 행동했는지 밝히는 **뚜렷한 주관**이 보여요. 편지에는 다아시 자신의 해명이 담겨 있어요. 설명이 자세해도 그가 내린 판단은 따로 살펴볼 필요가 있어요."},{"title":"작업실 규정을 이해했는데 계약 얘기가 나와요","body":"상대방은 함께 쓸 공간을 알아볼 때 월세에 관리비가 포함되는지까지 **확인해 줘요**. 당신은 새로운 조건을 알면 원래 **생각을 바꾸기도 해요**. 상대방은 제안을 차분히 들어 주는 당신에게 다시 이야기하기가 편하고, 당신은 상대방이 알아본 덕에 실제 비용을 따져 볼 수 있어요.\n\n공동 작업실을 알아보다 당신이 혼자 쓸 시간을 확보할 **수 있는지 물어요**. 상대방은 각자 쓸 시간대를 예약하는 규정을 보여 주고, 당신은 “아, 이제 알겠어”라고 답해요. 다음 날 상대방이 계약금을 언제 보낼지 묻자 당신은 당황해요. 일주일에 며칠이나 거기서 일하고 싶은지 아직 생각 중이었어요. 상대방은 가장 큰 걱정이 풀렸으니 둘 다 작업실을 원한다고 이해했어요. 당신은 자세히 알아봐 준 사람에게 다시 망설인다고 말하기가 어려워요."},{"title":"계약금 전에 각자 쓰고 싶은 시간을 말해요","body":"당신은 “예약 **방식은 이해했어**. 한 달 단위로 같이 빌리고 싶은지는 아직 모르겠어”라고 말해요. 상대방은 “나는 매주 이틀은 같이 쓰고 싶어. 계약금은 둘 다 결정할 때까지 보내지 않을게”라고 답해요.\n\n이번 일요일에 당신은 지난주 일정을 보고 혼자 작업할 시간이 얼마나 **필요한지 말해요**. 상대방은 하루씩 빌릴 수 있는지와 한 달 계약을 했을 때 각자 **낼 금액을 확인해요**. 둘 다 써 보고 싶고 하루 대여가 가능하다면 하루부터 써 봐요. 한 사람이 월 단위로 빌리고 싶지 않으면 공동 계약은 접고 각자 필요한 날만 공간을 구해요."}]},{"code":"T01","key":"정기","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-06/정기.md","sha":"3520c3369451a439ee56a975dc316fef283ae5a6","title":"함께 시작한 모임을 이어 가는 방법","work":"작은 아씨들","note":"정화 쪽은 ‘당신’, 기토 쪽은 ‘상대방’이에요. 성향은 원작 행동에 대한 해석이에요. 현대 장면과 대사는 가상이며 전체 명식 개인화는 적용하지 않았어요.","chapters":[{"title":"조와 베어가 플럼필드에서 학교를 꾸려요","body":"### 조 마치를 닮은 당신\n\n**열정** · **상상력**\n\n조는 플럼필드를 물려받자 그 집에 남자아이들이 지낼 학교를 열고 **싶다고 말해요**. 아이들이 배우면서 집처럼 편하게 지낼 곳을 그리는 데서 **상상력**이 보여요. 조는 베어가 가르치는 동안 자신도 아이들을 **돌보겠다고 말해요**. 실제로 학교를 꾸리고 아이들과 지내는 일을 즐기는 데서 **열정**을 읽을 수 있어요. 플럼필드를 물려받은 일은 계획을 실행할 수 있었던 중요한 조건이에요.\n\n### 프리드리히 베어를 닮은 상대방\n\n**다정함** · **성실함**\n\n베어는 조와 가게에 들렀다가 몸이 아픈 티나의 어머니에게 따뜻한 숄을 사 **주자고 해요**. 가까운 사람의 형편을 살피는 **다정함**이에요. 베어는 새로 구한 교직에서 일해 프란츠와 에밀을 **돕겠다고 말해요**. 이후 조와 결혼하고 플럼필드에 학교를 꾸려 가르치는 일을 맡아요. 가르치는 일을 이어 가는 데서 **성실함**이 보여요. 작품이 보여 주는 학교의 일상만으로 두 사람의 전체 노동량까지 알 수는 없어요."},{"title":"모임을 더 열자고 하니 상대방이 한숨을 쉬어요","body":"당신은 둘이 읽고 끝낼 책을 친구들과도 이야기해 **보자고 해요**. 새로운 일을 함께 해 보고 싶게 만드는 점이 상대방에게는 반가워요. 상대방은 처음 오는 친구에게도 따로 일정을 알려 주고 맡은 예약을 챙겨요. 당신은 그 덕에 새로 온 친구도 모임에 편하게 들어온다고 느껴요.\n\n한 달에 한 번 열던 독서 모임이 잘되자 당신은 두 번으로 늘리자고 해요. 상대방은 “지금도 전날 밤까지 참석 답을 받고 있어”라고 말해요. 당신은 같이 즐기던 일인데 자기만 기대하는 것 같아 서운해요. 상대방도 책 이야기하는 시간은 좋아해요. 다만 예약하고 답이 없는 사람에게 다시 연락하는 일이 계속 자기 몫이면 한 번 더 열 여유가 없어요. 상대방도 읽을 책을 고르고 토론을 이끌어 **보고 싶어요**."},{"title":"한 번 운영해 보고 모임 횟수를 정해요","body":"당신은 “뒤에서 연락할 일이 그렇게 많은 줄 몰랐어. 다음번 예약과 참석 확인은 **내가 할게”라고 말해요**. 상대방은 한 번은 책을 고르고 모임을 진행해 보고 싶다고 말해요. 두 사람은 예약, 참석 확인, 진행, 뒷정리를 다음 모임 전에 나눠요. 장소는 인원을 언제까지 바꿀 수 있는지 확인하고, 그 전에 참석 답을 받아요.\n\n모임이 끝난 날 각자 준비에 얼마나 걸렸고 어떤 일이 즐거웠는지 이야기해요. 둘 다 두 번 열 여유가 있으면 한 달만 시험해요. 시간이 빠듯하면 월 한 번을 유지하고, 그것도 어렵다면 다음 **달은 쉬어요**. 책을 고르는 일과 운영하는 일을 번갈아 맡으면 두 사람 다 하고 싶었던 일을 해 볼 수 있어요."}]},{"code":"T14","key":"정정","ref":"0ce1aeca224df7115d63b9c4f10f8c15cac8ff7b","path":"prose-reset-follow-up/batch-06/정정.md","sha":"2e19d037525220bd198a3a6a75cf6c77611ecd53","title":"기념일에 서로 원하는 시간을 보내요","work":"현자의 선물","note":"두 분 모두 델라와 짐의 관점을 함께 읽어요. 개인별 배역은 정하지 않아요. 성향은 원작 행동에 대한 해석이에요. 현대 장면과 대사는 가상이며 전체 명식 개인화는 적용하지 않았어요.","chapters":[{"title":"델라가 고른 사슬과 짐이 고른 빗","body":"### 델라의 관점\n\n**세심함** · **애정 깊음**\n\n델라는 짐에게 줄 크리스마스 선물을 사려고 **돈을 모아요**. 돈이 모자라자 머리카락을 팔고, 가게들을 돌아다니며 짐의 시계에 **어울리는 사슬을 골라요**. 짐이 낡은 가죽끈을 달아 쓰던 시계에 맞춰 선물을 고르는 데서 **세심함**이 보여요. 짐을 기쁘게 하려고 자기가 아끼던 것을 내놓는 행동에서는 **애정 깊음**을 읽을 수 있어요. 집에 돌아온 델라는 달라진 머리를 보고 짐이 어떻게 반응할지 걱정해요.\n\n### 짐의 관점\n\n**다정함** · **너그러움**\n\n짐은 델라가 오래 눈여겨본 빗을 사려고 자기 **시계를 팔아요**. 델라가 좋아하던 물건을 골라 선물하는 데서 **다정함**이 보여요. 짐은 델라의 짧아진 머리를 보고 한동안 멈춰 서지만, 머리 모양이 달라져도 애정은 **달라지지 않는다고 말해요**. 서로 준비한 선물을 당장 쓰기 어려워지자 잠시 두고 식사하자고 해요. 계획이 어긋난 자리에서 상대를 탓하지 않는 **너그러움**으로 해석할 수 있어요. 두 사람이 선물 때문에 치른 대가를 오늘날 연인의 애정 기준으로 삼을 필요는 없어요."},{"title":"예약이 반가운데 오늘은 멀리 나가기 힘들어요","body":"두 분 중 한 사람이 상대가 지나가며 좋다고 했던 식당을 기억해 기념일 **저녁을 예약했어요**. 예약 소식을 듣는 사람은 자기 말을 기억해 준 **게 고마워요**. 평소 두 사람은 상대가 준비한 일이 예상과 달라져도 함께 즐길 방법을 찾아왔어요.\n\n그런데 오늘은 바쁜 한 주가 끝난 금요일이에요. 식당 사진을 본 사람은 왕복 두 시간이 걸린다는 생각에 **대답이 늦어져요**. 예약한 사람이 “별로야?”라고 묻자 얼른 “좋아”라고 답해요. 쉬고 싶다고 하면 상대를 실망시킬 것 같았어요. 예약한 사람은 망설이는 표정을 보고 식당을 잘못 골랐나 싶어요. 그 식당에 가 보고 싶지만 오늘은 집에서 같이 저녁을 먹고 쉬고 싶다는 말이 아직 나오지 않았어요."},{"title":"식당이 좋은지와 오늘 갈 수 있는지 함께 말해요","body":"쉬고 싶은 사람은 “그 식당 기억해 **줘서 고마워**. 가 보고 싶어. 오늘은 너무 지쳐서 집에서 같이 먹고 싶어”라고 말해요. 예약한 사람은 “오늘 같이 가고 싶어서 조금 아쉬워. 다음 주로 옮길 수 있는지 지금 물어볼게”라고 답할 수 있어요.\n\n예약한 사람이 식당에 전화해 변경 가능한 날짜와 **취소 비용을 확인해요**. 둘 다 가능한 날짜가 있으면 그날로 옮겨요. 날짜를 못 맞추거나 다시 예약하기 부담스럽다면 오늘 예약은 취소하고 **발생한 비용을 확인해요**. 오늘은 가까운 곳에서 둘이 먹을 저녁을 주문하고, 외식 날짜는 나중에 정해도 돼요. 다음에 깜짝 약속을 준비할 때는 멀리 갈 수 있는 날인지 먼저 물어보고 장소를 비밀로 둘 수 있어요."}]},{"code":"T27","key":"갑경","ref":"efcee07c1c813251ac29cc6e322249cae79a28f9","path":"prose-reset-round-2/manuscripts/갑경.md","sha":"e570b21fa27367948207a0580e9ff304b41c189f","title":"잘 알아봐 줬어도 함께 골라야 해요","work":"오만과 편견","note":"기존 원고의 갑목 쪽을 ‘당신’, 경금 쪽을 ‘상대방’으로 부릅니다. 인물의 행동에서 읽은 성향을 참고하는 글이며 실제 두 분의 성격이나 전체 명식에 따른 개인화 결과는 아닙니다. 현대 생활 장면과 대사는 가상입니다.","chapters":[{"title":"엘리자베스와 다아시에게서 볼 수 있는 성향","body":"### 엘리자베스를 닮은 당신\n\n**독립심** · **뚜렷한 주관**\n\n다아시는 첫 청혼에서 엘리자베스의 가족과 **신분을 낮춰 말해요**. 엘리자베스는 재산이 많은 사람의 청혼이라도 원하지 않으면 거절해요. 좋은 조건보다 자신의 뜻에 따라 관계를 정하는 **독립심**이 보여요. 당신도 중요한 제안을 받으면 남들이 좋다는 조건보다 자신이 원하는지 먼저 살핀다면 이 모습과 비슷할 수 있어요.\n\n엘리자베스는 무엇이 불쾌했고 왜 거절하는지 **분명히 말해요**. 자기 생각을 숨기지 않는 **뚜렷한 주관**이 있어요. 다만 위컴의 말을 쉽게 믿었던 판단은 다아시의 편지를 읽고 돌아봐요. 자기 뜻을 지키는 사람도 사실을 잘못 알 수 있고, 새 정보를 듣고 판단을 고칠 수 있어요.\n\n### 다아시를 닮은 상대방\n\n**뚝심** · **강한 자기 확신**\n\n다아시는 가족과 신분에 대한 반대 이유를 의식하면서도 자신이 원하는 **혼인을 제안해요**. 마음먹은 일을 쉽게 포기하지 않는 **뚝심**으로 볼 수 있어요. 하지만 자신의 고민을 설명하면서 엘리자베스와 그 가족을 낮춰 말했어요. 결심이 굳다는 장점이 무례한 태도를 정당화하지는 않아요.\n\n첫 청혼에서 그는 엘리자베스가 받아들일 **것이라고 기대해요**. 자신의 마음과 판단에 대한 **강한 자기 확신** 때문에 상대의 뜻을 잘못 짚은 거예요. 이후 다시 고백할 때는 그녀의 마음이 여전하다면 더 말하지 않겠다고 합니다. 상대방도 확신 있게 제안하더라도 당신이 다른 답을 할 수 있다는 **점은 확인해야 해요**."},{"title":"알아본 수고와 고를 권리가 충돌할 때","body":"자기 생각을 분명히 말하는 사람과 결정한 일을 꾸준히 추진하는 사람은 함께 계획을 세우기 좋을 수 있어요. 원하는 것을 알려 주면 실행할 방법을 찾아 주니까요. 반면 한 사람은 준비가 끝났다고 생각하고 다른 사람은 아직 고르지 않았다고 생각하면 갈등이 생깁니다.\n\n함께 강좌를 듣기로 했는데 상대방이 링크를 보내요. “시간이랑 비용 다 봤어. 이걸로 신청하자.” 당신은 알아봐 준 것은 고맙지만 강의 내용이 마음에 들지 않아요. “나는 직접 글을 써 보는 수업을 듣고 싶었어. 뭘 배우고 싶은지는 안 물었잖아.” 상대방은 “같이 배우자고 해서 **찾아본 건데”라고 답해요**.\n\n상대방은 준비한 수고가 무시된 것 같고, 당신은 이미 고른 수업을 따라오라는 말처럼 들려요. 시간과 비용을 꼼꼼히 확인했어도 배우고 싶은 내용까지 같아지는 건 아니에요. 함께 강좌를 듣자는 데 동의했을 뿐, 이 강좌를 신청하는 데 동의한 것은 아니에요."},{"title":"원하는 내용부터 말하고 신청하기","body":"먼저 각자 수업에서 원하는 **것을 말해 보세요**. “시간이랑 비용 정리해 줘서 고마워. 나는 설명만 듣기보다 직접 써 보고 피드백받는 수업이 좋아.” 상대방도 “나는 비용이 부담 없고 평일 저녁에 갈 수 있으면 좋겠어”라고 조건을 보탤 수 있어요. **지금 찾은 강좌가 두 조건을 모두 만족하는지 확인해 보세요.**\n\n아직 결제하지 않았다면 두 사람이 동의할 때까지 신청을 미루세요. 이미 신청했다면 신청한 사람이 취소 가능 여부와 기한을 확인해 **알려 주세요**. 상대의 수고를 인정하는 것과, 의논 없이 신청한 방식을 바꿔 달라고 말하는 것은 함께 할 수 있어요.\n\n오늘 각자 후보 하나를 찾고 내일 저녁에 비교해 보는 식으로 다음 할 **일을 정해 보세요**. 그때도 원하는 내용이 다르면 각자 다른 수업을 듣고 끝난 뒤 만날 수 있어요. 같은 취미를 함께 즐기려던 계획을 두 사람 중 한 명이 원하는 수업을 포기하는 일로 만들 필요는 없어요."}]},{"code":"T03","key":"무기","ref":"efcee07c1c813251ac29cc6e322249cae79a28f9","path":"prose-reset-round-2/manuscripts/무기.md","sha":"f79a81ec2b9cd8f81a620233d3e93afa0e25b9ae","title":"요리만 끝나면 식사 준비도 끝난 걸까요","work":"작은 아씨들","note":"기존 원고의 무토 쪽을 ‘당신’, 기토 쪽을 ‘상대방’으로 부릅니다. 원작 행동에서 읽은 성향을 참고하는 글이며 실제 전체 명식 개인화는 적용하지 않았습니다. 현대 생활 장면과 대사는 가상입니다.","chapters":[{"title":"존과 메그에게서 볼 수 있는 성향","body":"### 존 브룩을 닮은 당신\n\n**책임감** · **고집스러움**\n\n『작은 아씨들』에서 존은 아이를 재우는 일을 맡고, 메그가 쉴 수 **있게 해요**. 가정에서 필요한 일을 직접 맡는 **책임감**으로 볼 수 있어요. 다만 원작의 훈육 방법을 그대로 따라야 **한다는 뜻은 아니에요**. 함께 사는 사람에게 필요한 일을 맡았다는 점을 참고할 수 있어요.\n\n그 전에는 집에서 소외된 듯 느끼면서도 메그와 돌봄을 어떻게 나눌지 충분히 의논하지 않고 이웃집에서 **저녁을 보내요**. 서운함을 먼저 풀지 않고 자기 방식을 이어 가는 **고집스러움**으로 해석할 수 있어요. 당신도 자신이 한 일은 충분하다고 생각해 상대가 무엇 때문에 지쳤는지 듣기 **어려울 때가 있나요**?\n\n### 메그를 닮은 상대방\n\n**세심함** · **성실함**\n\n메그는 아이들의 상태를 **살피고 밤낮으로 돌봐요**. 작은 변화에도 신경 쓰는 **세심함**과 매일 돌봄을 이어 가는 **성실함**이 보여요. 하지만 쉬지 못한 채 혼자 감당하면서 지쳐요. 일을 잘 챙기는 사람도 계속 맡으면 힘들 수 있어요.\n\n메그는 어머니의 조언을 듣고 존이 돌봄에 **더 참여하도록 해요**. 작품은 아내에게 남편을 참여시킬 책임을 많이 맡기지만, 오늘의 공동생활에서도 한 사람이 설명하고 부탁하는 일까지 모두 맡아야 하는 건 아니에요. 상대방이 꼼꼼하게 챙겨 준다는 이유로 당신은 지시를 기다리기만 하지는 않는지 살펴볼 수 있어요."},{"title":"둘 다 일했는데 한 사람만 계속 바쁠 때","body":"책임감 있게 실행하는 사람과 세심하게 준비하는 사람은 함께 일을 마치기 좋을 **수 있어요**. 하지만 한 사람은 눈에 보이는 작업만 맡고 다른 사람은 준비와 마무리까지 기억하면 부담이 달라집니다. 열심히 했는지보다 어디까지 맡았는지 확인해야 하는 상황이에요.\n\n두 분이 집에서 저녁을 먹는다고 **해 볼게요**. 상대방은 메뉴를 고르고 장을 본 뒤 냉장고를 정리해요. 당신은 요리를 맡아요. 식사를 마친 뒤 상대방이 설거지를 부탁하자 “요리는 내가 다 했잖아”라고 답해요. 당신은 할 일을 끝냈는데 또 부탁받는 것 같아요.\n\n상대방은 무엇을 먹을지 생각하는 것부터 남은 음식을 넣는 일까지 신경 쓰고 있었어요. 당신이 요리해 준 것은 고맙지만, 이후 할 일을 매번 알려 줘야 해서 여전히 혼자 식사를 챙기는 것 같아요. 두 사람 모두 수고했지만 식사 준비가 어디서 시작하고 끝나는지는 함께 정하지 않았어요."},{"title":"한 끼를 어디까지 맡을지 정하기","body":"상대방은 “요리해 줘서 고마워. 그런데 메뉴랑 장보기, 정리까지 계속 내가 생각하고 있어. 다음에는 한 끼를 처음부터 끝까지 맡아 줄 수 있어?”라고 말할 수 있어요. 당신도 “요리가 끝나면 내 일도 끝난 줄 알았어. 이번 토요일 저녁은 내가 준비하고 정리할게”처럼 맡을 범위를 분명히 답해 보세요.\n\n메뉴 결정, 재료 확인, 장보기, 요리, 설거지와 남은 음식 정리 중 어디까지 담당하는지 정하세요. 한 사람이 한 끼를 전부 맡을 수도 있고 나눠 맡을 수도 있어요. 중요한 것은 다른 사람이 계속 기억하고 지시하지 않아도 담당자가 자기 일을 마칠 수 있는지예요.\n\n가능한 시간과 체력이 다르다면 억지로 같은 양을 나누기보다 이번에 감당할 **일을 말해 주세요**. 힘든 날은 미리 알리고 간단히 먹거나 담당을 바꿀 수 있어요. 바꾸자는 말이 나오지 않았다고 상대가 계속 괜찮은 것은 아니에요.\n\n다음 식사 뒤에는 빠진 일을 누가 다시 챙겼는지, 한 사람이 계속 부탁해야 했는지 **확인해 보세요**. 준비와 마무리가 빠졌다면 담당 범위를 다시 정하면 돼요. 서운함을 설명하는 것과 각자 맡을 일을 바꾸는 것이 함께 이루어져야 해요."}]},{"code":"T16","key":"병계","ref":"efcee07c1c813251ac29cc6e322249cae79a28f9","path":"prose-reset-round-2/manuscripts/병계.md","sha":"b41a4a9184c7aa8718b638d7c2f9988bcc836268","title":"좋아하는 마음과 지킬 수 있는 약속","work":"로미오와 줄리엣","note":"기존 원고의 병화 쪽을 ‘당신’, 계수 쪽을 ‘상대방’으로 부릅니다. 아래 성향은 원작 행동에 대한 해석이며 실제 두 분의 성격을 확인한 결과가 아닙니다. 전체 명식 개인화는 적용하지 않았고, 현대 생활 장면과 대사는 가상입니다.","chapters":[{"title":"로미오와 줄리엣이 마음을 표현하는 방법","body":"### 로미오를 닮은 당신\n\n**솔직함** · **성급함**\n\n로미오는 줄리엣에게 사랑하는 마음을 밝히고 달을 증인 삼아 **맹세하려 해요**. 감정을 숨기지 않고 전하는 **솔직함**이 보여요. **당신도 좋아하는 마음이 커지면 바로 표현하고 싶다면 이 모습과 비슷할 수 있어요.** 분명한 표현은 상대가 마음을 아는 데 도움이 돼요.\n\n다만 그날의 마음을 곧바로 맹세로 만들려는 **성급함**도 볼 수 있어요. 줄리엣은 그 약속이 **너무 갑작스럽다고 말해요**. 진심으로 한 말이라도 상대가 준비됐는지, 실제로 어떻게 지킬지는 **따로 확인해야 해요**.\n\n### 줄리엣을 닮은 상대방\n\n**신중함** · **적극성**\n\n줄리엣은 변하는 달에 사랑을 맹세하지 **말라고 해요**. 성급한 약속을 경계하는 **신중함**이 보여요. 로미오를 좋아하지 않아서 제지하는 **것은 아니에요**. 자신의 사랑도 밝히면서 그날 바로 맹세하는 방식에는 우려를 말해요.\n\n줄리엣은 혼인할 뜻이 진지하다면 다음 날 소식을 보내 달라고 하고, 사람을 언제 **보낼지도 물어요**. 원하는 다음 행동을 직접 말하는 **적극성**이 있어요. 그녀 역시 혼인 이야기를 빠르게 꺼내므로 언제나 차분하게 판단하는 사람으로 고정할 **수는 없어요**. 상대방도 약속의 내용을 묻는다고 소극적이거나 덜 좋아하는 것은 아닐 수 있어요."},{"title":"진심으로 약속했는데 지키지 못했을 때","body":"솔직하게 애정을 표현하는 사람에게는 좋아한다는 말을 쉽게 들을 수 **있어 반가워요**. 약속을 신중히 살피는 사람은 무리한 계획을 조정하는 데 도움이 됩니다. 하지만 표현한 진심을 중요하게 생각하는 사람과 실제 이행을 중요하게 생각하는 사람은 같은 약속을 다르게 평가할 수 있어요.\n\n당신이 바쁜 상대방에게 “앞으로 매일 밤 전화해 줄게”라고 말했다고 **해 볼게요**. 처음 며칠은 즐겁게 통화했지만 일이 늦게 끝나면서 연락 없이 건너뛴 날이 생깁니다. 상대방이 기다렸다고 하자 당신은 “그날 진심이었던 건 알잖아”라고 답해요.\n\n당신은 좋아하는 마음을 의심받은 것 **같아 서운해요**. 상대방은 진심을 따지려던 게 아니라, 그날도 전화를 기다려야 하는지 알고 싶었어요. 매일 통화하겠다고 약속했다면 못 하는 날에는 알려 줘야 상대도 자기 시간을 정할 수 있어요.\n\n원작의 맹세와 현대의 전화 약속은 서로 다른 상황이에요. 여기서 참고할 점은 좋아하는 마음을 확인한 뒤에도 약속의 내용과 다음 행동을 구체적으로 이야기할 수 있다는 점이에요."},{"title":"가능한 통화 시간과 변경 방법 정하기","body":"**먼저 약속을 못 지킨 일을 인정해 보세요.** “매일 전화하겠다고 했는데 연락 없이 건너뛰었어. 기다리게 해서 미안해. 이번 주에는 화요일과 목요일 밤에 통화할 수 있어.” 상대방도 “매일 해야 하는 건 아니야. 못 하는 날은 미리 알려 줬으면 해”라고 원하는 것을 말할 수 있어요.\n\n두 사람이 가능한 횟수와 시간을 정하세요. 길게 통화하기 어려운 날에는 짧은 메시지로 안부만 전할지, 그날은 쉬고 다른 날 통화할지도 의논할 수 있어요. 한 사람이 매일 통화를 원하더라도 다른 사람이 감당하기 어렵다면 그 차이를 그대로 이야기해야 해요.\n\n약속한 날 통화가 어려워지면 정한 시간 전에 알려 주세요. 다음 시간을 아직 모른다면 “내일 낮에 일정을 확인해서 다시 말할게”처럼 언제 알릴 수 있는지 말하면 돼요. 일주일 뒤에는 실제로 지킬 수 있었는지 **확인하고 조정해 보세요**. 약속을 크게 하기보다 두 사람이 기다릴 시간과 쉴 시간을 알 수 있게 하는 것이 필요해요."}]},{"code":"T29","key":"신신","ref":"efcee07c1c813251ac29cc6e322249cae79a28f9","path":"prose-reset-round-2/manuscripts/신신.md","sha":"5ad0b0fb1bf60e4f594059bb46c8a3def30a0252","title":"둘 다 꼼꼼해도 확인하는 순서는 달라요","work":"셜록과 마이크로프트","note":"원작의 셜록 홈스와 마이크로프트 홈스는 형제입니다. 그 관계를 연애로 바꾸지 않고 행동에서 읽은 성향을 참고합니다. 동일 일간인 두 분은 두 관점을 함께 읽으며 개인별 배역을 지정하지 않아요. 실제 전체 명식 개인화는 적용하지 않았고, 현대 생활 장면과 대사는 가상입니다.","chapters":[{"title":"셜록과 마이크로프트가 확인하는 방법","body":"### 셜록 홈스의 관점\n\n**꼼꼼함** · **적극성**\n\n「그리스어 통역관」에서 셜록과 형 마이크로프트는 지나가는 사람의 복장과 소지품을 **보고 추론해요**. 셜록이 아이가 있다고 하자, 형은 딸랑이와 그림책을 함께 보고 아이가 여럿일 것이라고 덧붙여요. 작은 단서를 살피는 셜록의 **꼼꼼함**과 서로의 관찰을 보완하는 대화가 보여요. 다만 행인의 가족 사정이 실제로 확인된 장면은 아닙니다.\n\n위험에 처한 사람이 있는 집의 주소를 알게 되자 셜록은 경찰과 함께 곧바로 **가자고 해요**. 알아낸 내용을 행동으로 옮기는 **적극성**이 있어요. 이때 서두른 이유는 사람을 구하는 일이 급했기 때문이에요. 셜록의 행동을 근거로 언제나 빨리 움직이는 쪽이 옳다고 할 **수는 없어요**.\n\n### 마이크로프트 홈스의 관점\n\n**분석적 성향** · **신중함**\n\n마이크로프트는 딸랑이 하나만 보지 않고 그림책과 비교해 아이들의 나이를 추정해요. 여러 단서를 함께 따지는 **분석적 성향**이 보여요. 두 분도 상대가 자신이 놓친 조건을 짚어 주면 안심하거나 고마울 **수 있어요**.\n\n제보 편지를 받은 뒤 마이크로프트는 편지를 보낸 사람에게 먼저 가서 사정을 더 듣자고 제안해요. 추가 정보를 확인하려는 **신중함**으로 볼 수 있지만, 셜록은 구조가 더 급하다고 판단해요. 검토하는 동안 무엇이 늦어지는지도 따져야 하는 상황이었어요. 마이크로프트도 이후 구조 현장에 함께 가므로, 형은 검토만 하고 동생은 행동만 하는 관계로 나눌 **수는 없어요**.\n\n두 사람 모두 세부를 중요하게 여기지만 다음에 할 일은 다르게 제안해요. 두 분에게도 비슷한 차이가 있을 **수 있어요**. 같은 신금이라는 분류만으로 누가 먼저 움직이고 누가 검토할지 정할 수는 없어요."},{"title":"서로의 꼼꼼함이 답답하게 느껴질 때","body":"함께 쓸 작업실을 찾으며 한 사람은 교통편을, 다른 사람은 관리비를 확인한다고 **해 볼게요**. “그건 생각 못 했는데 잘 봤네”라는 말이 오갑니다. 서로 꼼꼼하게 알아봐 주니 함께 결정해도 괜찮겠다는 생각이 들어요.\n\n마음에 드는 방을 토요일에 볼 수 있다는 연락이 옵니다. 한 사람은 “옆방 소리가 들리는지 **가서 확인하자”고 해요**. 다른 사람은 “중도 해지 조건이 걸려. 가기 전에 답을 듣고 싶어”라고 말해요. 방문을 제안한 사람은 “계약하자는 것도 아닌데 보러 가는 것도 안 돼?”라고 답해요.\n\n계약서를 읽던 사람은 방을 보고 나면 거절하기 어려워질까 걱정해요. 방문을 제안한 사람은 자신을 성급하게 계약할 사람으로 보는 것 같아 서운해요. 두 사람 모두 꼼꼼하고 세심한 성격이지만, 서로에게는 오히려 지나치게 재촉하거나 결정을 미루는 사람처럼 보일 수 있어요.\n\n차이는 확인할 의지가 아니라 순서에 있어요. 한 사람은 직접 봐야 알 수 있는 문제가 먼저이고, 다른 사람은 계약 조건을 알아야 편하게 방문할 수 있어요. 이 작업실에서는 원작의 긴급 구조와 달리 방문을 먼저 제안한 쪽이 더 옳다고 판단할 근거가 없어요."},{"title":"방문 여부와 계약 여부를 따로 정하기","body":"**먼저 방문 제안이 어떻게 들렸는지 확인해 보세요.** “보러 가면 계약도 해야 할 것 같아서 걱정됐어?” 다른 사람은 “응. 마음에 들어도 거절할 수 있는지 먼저 확인하고 싶었어”라고 답할 수 있어요. 방문을 제안한 사람도 “나는 소음이 크면 다른 곳을 찾을 생각이었어. 보러 가는 것도 안 되냐고 날카롭게 말한 건 미안해”라고 설명할 수 있어요.\n\n방문과 계약을 따로 의논하세요. “토요일에는 방만 보자. 계약은 돌아와서 다시 정하고, 그날 결정하지 않아도 괜찮아.” 방문에 비용이나 다른 약속이 따르는지는 중개인에게 확인하고, 해지 조건에 대한 질문도 보내 두세요. 방문 조건을 모르거나 한 사람이 여전히 부담스럽다면 날짜를 미룰 수 있어요.\n\n함께 간다면 각자 중요했던 내용을 **확인해 보세요**. 계약서를 읽던 사람이 소음을 듣고, 방문을 제안한 사람이 조항의 답변을 확인해도 됩니다. 한 사람만 가기로 했다면 무엇을 보고 공유할지 먼저 정하세요. 먼저 본 사람이 좋다고 해도 다른 사람의 동의를 대신할 수는 없어요.\n\n방문한 날 저녁에 다시 이야기하되, 답변이 없거나 한 사람이 원하지 않으면 계약을 보류하세요. 추가 확인을 할지 다른 방을 찾을지 정하면 돼요. 서로의 꼼꼼함을 존중한다는 것은 상대가 중요하게 생각하는 확인도 실제 결정에 반영하는 거예요."}]},{"code":"T05","key":"정신","ref":"efcee07c1c813251ac29cc6e322249cae79a28f9","path":"prose-reset-round-2/manuscripts/정신.md","sha":"84742557730f3235be3359e22c7103f20db4e3e2","title":"꼼꼼히 세운 계획도 함께 조정해야 해요","work":"왓슨과 홈스","note":"원작의 왓슨과 홈스는 친구이자 수사 협력자입니다. 아래에서는 그들의 행동에서 읽은 성향을 연인의 생활에 적용해 봅니다. 기존 원고의 정화 쪽을 ‘당신’, 신금 쪽을 ‘상대방’으로 부르되 실제 두 분의 성격을 확인한 건 아니에요. 전체 명식 개인화는 적용하지 않았고, 현대 생활 장면과 대사는 가상입니다.","chapters":[{"title":"왓슨과 홈스에게서 볼 수 있는 성향","body":"### 왓슨을 닮은 당신\n\n**세심함** · **책임감**\n\n「그리스어 통역관」에서 홈스가 경찰과 함께 구조하러 가자고 하자, 왓슨은 가는 길에 통역관 **멜라스를 데려가자고 제안해요**. 현장에서 통역이 필요할 수 있다고 **생각한 거예요**. 홈스는 그 제안을 받아들여요. 계획에 빠진 필요를 알아차리고 알리는 **세심함**이 보여요. 당신도 상대가 정리한 일정에서 식사 시간이나 이동의 불편을 먼저 발견한다면 이 모습과 비슷할 수 있어요.\n\n「악마의 발」에서는 독성 물질을 시험하다 두 사람 **모두 위험에 빠져요**. 왓슨은 홈스의 상태를 보고 그를 끌어안은 채 함께 문밖으로 나옵니다. 자신도 힘든 상황에서 친구를 돕는 **책임감**으로 볼 수 있어요. 다만 홈스도 나중에 사과했듯, 애초에 해서는 안 될 위험한 실험이었어요. 이 행동을 연인에게 위험을 감수하라는 조언으로 가져올 수는 없어요.\n\n### 홈스를 닮은 상대방\n\n**꼼꼼함** · **강한 자기 확신**\n\n홈스는 「악마의 발」에서 램프에 남은 가루를 **조사하고 일부만 가져와요**. 나머지는 경찰이 살필 증거로 남겨 둡니다. 작은 흔적뿐 아니라 이후 조사까지 챙기는 **꼼꼼함**이 보여요. 상대방도 여러 후보를 비교하고 선택한 이유를 자세히 설명하는 편이라면 이 성향을 떠올릴 수 있어요.\n\n하지만 홈스는 자신이 세운 방법으로 실험을 통제할 수 있다고 생각했고, 실제 영향은 **예상보다 빠르고 심했어요**. 이때의 **강한 자기 확신**은 위험을 과소평가한 판단으로 이어집니다. 꼼꼼하게 조사하는 사람도 판단을 잘못할 수 있어요. 다른 단편 「노란 얼굴」에서는 홈스가 오판한 뒤, 자신이 다시 지나치게 자신만만해지면 노버리라는 이름을 들려 달라고 왓슨에게 부탁해요. 세 단편을 하나의 성장 과정으로 단정할 수는 없지만, 자기 판단을 돌아보려는 모습도 확인할 수 있어요."},{"title":"준비해 준 것은 고맙지만 그대로 따르기는 어려울 때","body":"세심하게 불편을 알아차리는 사람과 꼼꼼하게 계획을 세우는 사람은 서로에게 **든든할 수 있어요**. 한 사람은 빠뜨린 조건을 알려 주고, 다른 사람은 실행할 방법을 찾아 주니까요. 다만 자기 계획에 확신이 강하면 상대의 걱정을 이미 검토한 문제로 여기기 쉬워요. 걱정을 말한 사람은 자신의 사정이 무시됐다고 느낄 수 있어요.\n\n주말 여행을 앞두고 상대방이 숙소와 교통편을 보내왔다고 **해 볼게요**. 당신이 가고 싶다던 곳도 들어 있어 반가워요. 그런데 일요일 밤 11시가 넘어야 집에 도착하는 일정이에요. “월요일에 일찍 출근해야 해서 너무 피곤할 것 같아”라고 말하자 상대방이 답해요. “이게 제일 저렴하고 환승도 없어. 일찍 오면 마지막 날은 거의 못 보잖아.”\n\n당신은 장점을 몰라서 묻는 게 아니에요. 다음 날 출근할 체력을 생각해 귀가 시간을 바꾸고 싶어요. 같은 걱정을 다시 말하자 “그럼 네가 찾아봐”라는 답이 돌아와요. 당신에게는 수정이 필요하면 전부 맡으라는 말처럼 들리고, 상대방은 준비한 수고를 인정받지 못한 것 같아 서운해요.\n\n여행을 함께 가고 싶은 마음은 같지만 중요하게 생각하는 조건은 달라요. 당신은 휴식 시간이, 상대방은 비용과 마지막 날의 일정이 중요해요. 상대방이 알아본 수고에 감사하면서도 귀가 시간에는 동의하지 않을 수 있어요."},{"title":"귀가 시간과 비용을 함께 비교하기","body":"먼저 전부 다시 맡기려던 뜻이 아니었다고 설명해 보세요. “여행은 가고 싶어. 다만 일요일 밤 9시까지는 집에 와야 해. 돌아오는 편을 같이 바꾸자는 뜻이었어.” 상대방도 “내가 알아본 게 다 소용없다는 말처럼 들렸어. 전부 네가 찾으라고 한 건 미안해”라고 서운함과 사과를 나눠 말할 수 있어요.\n\n이제 역 도착 시간이 아니라 집에 도착하는 시간을 **기준으로 후보를 찾아보세요**. 상대방은 이른 교통편을, 당신은 마지막 날 줄일 수 있는 일정을 확인하는 식으로 나눌 수 있어요. 이번에 여유 있는 사람이 다른 일을 맡아도 됩니다. 빠진 조건을 찾는 일이나 계획을 고치는 일이 늘 한 사람의 몫일 필요는 없어요.\n\n이른 편이 더 비싸다면 차액을 얼마까지 감당할 수 있는지 **말해 보세요**. 귀가 시간을 맞추면서 비용도 줄일 방법이 없다면 여행을 하루 줄이거나 날짜를 미룰 수 있어요. 쉬어야 할 시간을 포기하거나 추가 비용을 무조건 내는 것 중 하나만 고를 필요는 없어요.\n\n내일 저녁까지 후보를 비교한 뒤 두 사람이 동의한 일정으로 예약하세요. 그때도 결론이 나지 않으면 아직 확인하지 못한 조건과 다시 이야기할 시간을 **정해 주세요**. 다녀온 뒤에는 실제 귀가 시간과 다음 날 피로를 확인하면 다음 여행을 계획할 때 도움이 됩니다."}]}]}</script>
